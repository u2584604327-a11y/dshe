name: P143 original com.dsh.android isolated engine archive FD (emulator only)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p76_original_engine_fd/android/com/dsh/android/p76/P76EngineArchiveFdProbe.java'
      - 'host_candidate/p143_same_package_engine_fd/**'
      - 'host_candidate/p159_emulator_root_reattach.sh'
      - 'host_candidate/p159_emulator_root_reattach.test.sh'
      - 'host_candidate/p144_scoped_source_broker/**'
      - 'host_candidate/p145_exact_boot_entry/**'
      - 'host_candidate/p146_cli_import_hints/**'
      - 'host_candidate/p147_relative_candidate_lease/**'
      - 'host_candidate/p149_prelaunch_witness/**'
      - 'host_candidate/p150_original_coroutine/**'
      - 'host_candidate/p151_original_state_probe/**'
      - 'host_candidate/p152_termux_readonly/**'
      - 'host_candidate/p153_node_elf/**'
      - 'host_candidate/p156_original_app_lib_uid/**'
      - 'host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java'
      - 'host_candidate/p43_original_service/android/com/dsh/android/p43/P43ProbeActivity.java'
      - 'host_candidate/p77_engine_tar_audit/src/com/dsh/android/p77/P77TarAudit.java'
      - 'host_candidate/p43_original_service/build_embedded_emulator_apk.sh'
      - '.github/workflows/p143-original-package-isolated-engine-fd.yml'
permissions:
  contents: read
concurrency:
  # P151 passive original-engine observation needs >40s after Binder HELLO.
  # Unrelated same-PR OGNET source pushes must not cancel active emulator evidence.
  # Stale-HEAD results remain non-admissible for release; never auto-deploy.
  group: p143-original-fd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verified-original-package-archive-fd:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify original-only test host, no license acceptance or privileged tool
        shell: bash
        run: |
          set -euo pipefail
          test "$P47_NO_HOST_FALLBACK" = 1 && test "$P49_NODE_STAGE" = 0 && test "$P51_SIDE_BY_SIDE" = 0
          bash -n host_candidate/p143_same_package_engine_fd/run_real_original_emulator.sh
          # P167 test-only cold Binder ACK window: never loosen actual
          # UID, session, hash, fail-closed or non-archive 12s budget.
          python3 - <<'P167'
          from pathlib import Path
          src=Path('host_candidate/p43_original_service/android/com/dsh/android/p43/P43ProbeActivity.java').read_text()
          assert 'getBooleanExtra("p76_archive",false)' in src
          assert 'p143ArchiveTest?45000L:12000L' in src
          assert 'if(!received&&!failed)fail("BINDER_ACK_TIMEOUT")' in src
          assert 'android.os.Process.isIsolatedUid(m.sendingUid)' in src
          assert '!session.equals(m.getData().getString("session"))' in src
          print('P167_ONLY_P143_ARCHIVE_ACK_DEADLINE_EXTENDED_KEEP_UID_SESSION_DENY=PASS')
          P167
          bash -n host_candidate/p159_emulator_root_reattach.sh
          bash host_candidate/p159_emulator_root_reattach.test.sh
          grep -Fq 'P144ScopedSourceBroker.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq 'P145ExactBootEntry.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq 'P146DirectImports.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq 'P147ScopedCandidateLease.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq 'P149OriginalBuilderWitness.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq 'P150OriginalCoroutineObserver.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq 'P151OriginalEngineStateSampler.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq 'P152TermuxReadOnly.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq 'P153OriginalNodeElfProbe.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          mkdir -p .p156classes
          javac --release 8 -d .p156classes host_candidate/p156_original_app_lib_uid/src/com/dsh/android/p156/P156PrivateLibAudit.java host_candidate/p156_original_app_lib_uid/test/com/dsh/android/p156/P156PrivateLibAuditTest.java
          java -cp .p156classes com.dsh.android.p156.P156PrivateLibAuditTest
          rm -rf .p156classes
          grep -Fq 'P156OriginalAppLibProbe.java' host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq 'P149OriginalBuilderWitness.observeWithoutLaunch' host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java
          mkdir -p .p149classes
          javac --release 8 -d .p149classes \
            host_candidate/p149_prelaunch_witness/src/com/dsh/android/p149/P149OriginalBuilderWitness.java \
            host_candidate/p150_original_coroutine/src/com/dsh/android/p150/P150OriginalCoroutineObserver.java \
            host_candidate/p151_original_state_probe/src/com/dsh/android/p151/P151OriginalEngineStateSampler.java \
            host_candidate/p152_termux_readonly/src/com/dsh/android/p152/P152CauseClassifier.java \
            host_candidate/p152_termux_readonly/test/com/dsh/android/p152/P152CauseClassifierTest.java \
            host_candidate/p153_node_elf/src/com/dsh/android/p153/P153ElfHeader.java \
            host_candidate/p153_node_elf/test/com/dsh/android/p153/P153ElfHeaderTest.java \
            host_candidate/p151_original_state_probe/test/com/dsh/android/p151/P151SyntheticStateTest.java \
            host_candidate/p150_original_coroutine/test/com/dsh/android/p150/P150OriginTest.java \
            host_candidate/p149_prelaunch_witness/test/com/dsh/android/p149/P149WitnessTest.java \
            host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java
          java -cp .p149classes com.dsh.android.p149.P149WitnessTest
          java -cp .p149classes com.dsh.android.p150.P150OriginTest
          java -cp .p149classes com.dsh.android.p151.P151SyntheticStateTest
          java -cp .p149classes com.dsh.android.p152.P152CauseClassifierTest
          java -cp .p149classes com.dsh.android.p153.P153ElfHeaderTest
          rm -rf .p149classes
          mkdir -p .p146classes
          javac --release 8 -d .p146classes \
            host_candidate/p78_module_slot/src/com/dsh/android/p78/P78ModuleSlot.java \
            host_candidate/p77_engine_tar_audit/src/com/dsh/android/p77/P77TarAudit.java \
            host_candidate/p144_scoped_source_broker/src/com/dsh/android/p144/P144ScopedSourceBroker.java \
            host_candidate/p145_exact_boot_entry/src/com/dsh/android/p145/P145ExactBootEntry.java \
            host_candidate/p146_cli_import_hints/src/com/dsh/android/p146/P146DirectImports.java \
            host_candidate/p147_relative_candidate_lease/src/com/dsh/android/p147/P147ScopedCandidateLease.java \
            host_candidate/p147_relative_candidate_lease/test/com/dsh/android/p147/P147SyntheticTest.java \
            host_candidate/p146_cli_import_hints/test/com/dsh/android/p146/P146SyntheticTest.java
          java -cp .p146classes com.dsh.android.p146.P146SyntheticTest
          java -cp .p146classes com.dsh.android.p147.P147SyntheticTest
          rm -rf .p146classes
          grep -Fq 'p145_exact_cli_entry_verified' host_candidate/p76_original_engine_fd/android/com/dsh/android/p76/P76EngineArchiveFdProbe.java
          grep -Fq 'p144_two_readonly_resources_verified' host_candidate/p76_original_engine_fd/android/com/dsh/android/p76/P76EngineArchiveFdProbe.java
          bash -n host_candidate/p43_original_service/build_embedded_emulator_apk.sh
          grep -Fq '"com.dsh.android.p43.P43ProbeActivity".equals(host.getClass().getName())' host_candidate/p76_original_engine_fd/android/com/dsh/android/p76/P76EngineArchiveFdProbe.java
          grep -Fq '"com.dsh.android".equals(host.getPackageName())' host_candidate/p76_original_engine_fd/android/com/dsh/android/p76/P76EngineArchiveFdProbe.java
          grep -Fq 'P76_FAILED_TO_UNLINK_HOST_PATH' host_candidate/p76_original_engine_fd/android/com/dsh/android/p76/P76EngineArchiveFdProbe.java
          python3 -m pip install --no-cache-dir -r host_candidate/requirements.txt
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -s "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/d8"
      - name: Build full pinned v138 original-package temporary APK and assert P47 host denies
        shell: bash
        run: |
          set -euo pipefail
          if ! bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh > .p143_build.log 2>&1; then
            grep -E 'P43_|P47_|P76_|P143_|error:|Traceback' .p143_build.log | tail -n 20 || true
            exit 1
          fi
          apk=.p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$sdk/build-tools/35.0.0/aapt" dump badging "$apk" | grep -Fq "package: name='com.dsh.android'"
          grep -Fxq 'P43_ORIGINAL_ASSETS_LIBRARIES_AND_SECONDARY_DEX=PASS_SHA' .p143_build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p143_build.log
          grep -Fxq 'P43_APK_ORIGINAL_COMPONENTS_AND_APPLICATION_PRESERVED=PASS_STATIC' .p143_build.log
          echo P143_PINNED_ORIGINAL_DSH_TEST_APK_BUNDLE=PASS
      - name: Enable ephemeral emulator KVM
        shell: bash
        run: if test -c /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Android35 actual app + isolated worker original archive FD and full TAR
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p143_same_package_engine_fd/run_real_original_emulator.sh
      - name: Clear original scratch, test signer and logs even on failed gate
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p143_build.log
          echo P143_PRODUCTION_NODE_SCRIPTS=NOT_EXECUTED >> "$GITHUB_STEP_SUMMARY"
          echo P159_DISPOSABLE_ROOT_REATTACH=CHECK_EMULATOR_JOB_NOT_ASSUMED_PASS >> "$GITHUB_STEP_SUMMARY"
          echo P144_TWO_SOURCE_BROKER=CHECK_EMULATOR_JOB >> "$GITHUB_STEP_SUMMARY"
          echo P145_EXACT_ORIGINAL_ENTRY=CHECK_EMULATOR_JOB >> "$GITHUB_STEP_SUMMARY"
          echo P146_ORIGINAL_CLI_STATIC_IMPORT_HINTS=CHECK_EMULATOR_JOB >> "$GITHUB_STEP_SUMMARY"
          echo P146_FULL_RUNTIME_DEPENDENCY_GRAPH=NOT_PROVEN >> "$GITHUB_STEP_SUMMARY"
          echo P147_SECOND_PASS_VERIFIED_SOURCE=CHECK_EMULATOR_JOB >> "$GITHUB_STEP_SUMMARY"
          echo P149_P47_ORIGINAL_MAIN_DEX_WITNESS_SYNTHETIC=CHECK_EMULATOR_JOB >> "$GITHUB_STEP_SUMMARY"
          echo P150_COROUTINE_STACK=CHECK_ANDROID_LOGCAT_NOT_ASSUMED_PASS >> "$GITHUB_STEP_SUMMARY"
          echo P151_READ_ONLY_EXISTING_ENGINE_STATE=CHECK_ANDROID_LOGCAT >> "$GITHUB_STEP_SUMMARY"
          echo P152_TERMUX_EXACT_BRANCH=CHECK_ANDROID_LOGCAT >> "$GITHUB_STEP_SUMMARY"
          echo P152_NODE_PROCESS_OR_RESTART=DENIED >> "$GITHUB_STEP_SUMMARY"
          echo P153_REAL_NODE_ELF_ARCH_AND_PT_INTERP=CHECK_ANDROID_LOGCAT >> "$GITHUB_STEP_SUMMARY"
          echo P153_PRODUCTION_NODE_EXECUTION=DENIED >> "$GITHUB_STEP_SUMMARY"
          echo P156_APP_UID_LIB_ACCESS=CHECK_EMULATOR_ONLY >> "$GITHUB_STEP_SUMMARY"
          echo P156_PRODUCTION_ELF_LOADER=NOT_PROVEN >> "$GITHUB_STEP_SUMMARY"
          echo P151_NODE_STARTUP_PROVEN=NO >> "$GITHUB_STEP_SUMMARY"
          echo P150_NATIVE_IDENTITY_PROVEN=NO >> "$GITHUB_STEP_SUMMARY"
          echo P149_ORIGINAL_ENGINEMANAGER_PRODUCTION_PARAMETERS=NOT_PROVEN >> "$GITHUB_STEP_SUMMARY"
          echo P147_ACTUAL_DEPENDENCY_CLOSURE=NOT_PROVEN >> "$GITHUB_STEP_SUMMARY"
          echo P145_PRODUCTION_ENGINE_MANAGER_HANDOFF=NOT_WIRED >> "$GITHUB_STEP_SUMMARY"
          echo P144_PRODUCTION_NODE_MODULE_RESOLUTION=NOT_WIRED >> "$GITHUB_STEP_SUMMARY"
          echo P143_REAL_ENGINE_MANAGER_HANDOFF=NOT_WIRED >> "$GITHUB_STEP_SUMMARY"
          echo P143_NATIVE_SENSITIVE_TOOLS=DENY_ALL >> "$GITHUB_STEP_SUMMARY"
          echo P143_FIXED_SIGNED_V139=BLOCKED >> "$GITHUB_STEP_SUMMARY"
