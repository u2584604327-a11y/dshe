name: P131 pinned ARM64 c-ares guest-linker relocation (offline)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p131_pinned_cares_guest_link_probe.sh'
      - '.github/workflows/p131-pinned-cares-guest-link.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p131-cares-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-cares-dt-needed:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact signed v138 and stage pinned ARM64 library
        run: |
          set -euo pipefail
          bash -n host_candidate/p131_pinned_cares_guest_link_probe.sh
          mkdir -p "$RUNNER_TEMP/p131-input"
          gh release download dsh-baseline-v135dsh-baseline-v135 --repo "$GH_REPO" --pattern DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk --dir "$RUNNER_TEMP/p131-input"
          printf "%s  %s\n" 3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5 "$RUNNER_TEMP/p131-input/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk" | sha256sum -c -
          python3 host_candidate/p127_google_apis_nativebridge_original_node_stage.py "$RUNNER_TEMP/p131-input/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk" "$RUNNER_TEMP/p131-stage"
          echo "P131_STAGE=$RUNNER_TEMP/p131-stage" >> "$GITHUB_ENV"
      - name: Native NDK compile-only and pinned symbol preflight
        run: P131_COMPILE_ONLY=1 bash host_candidate/p131_pinned_cares_guest_link_probe.sh "$P131_STAGE"
      - name: Enable KVM for disposable Android emulator
        run: if test -c /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Run isolated synthetic libc and pinned c-ares execution controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: P131_COMPILE_ONLY=0 bash host_candidate/p131_pinned_cares_guest_link_probe.sh "$P131_STAGE"
      - name: Cleanup all original assets and preserve deny-only gate
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/p131-input" "$RUNNER_TEMP/p131-stage"
          echo P131_ORIGINAL_NODE=NOT_EXECUTED >> "$GITHUB_STEP_SUMMARY"
          echo P131_ISOLATED_UID=NOT_TESTED >> "$GITHUB_STEP_SUMMARY"
          echo P131_P109_AUTHORITY=DENY_ALL >> "$GITHUB_STEP_SUMMARY"
          echo P131_RELEASE_V139=BLOCKED >> "$GITHUB_STEP_SUMMARY"
