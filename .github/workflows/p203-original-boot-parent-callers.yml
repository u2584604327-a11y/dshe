name: P203 signed v138 MainActivity bootEngine exact upstream callers (static no Node)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p203_original_boot_parents/**'
      - '.github/workflows/p203-original-boot-parent-callers.yml'
permissions:
  contents: read
concurrency:
  group: p203-original-boot-parents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-mainactivity-parent-upstream:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P181_THREE_ORIGINAL_START_DENY: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 22 synthetic negative tests, pinned original DEX dependencies and no runtime permission
        shell: bash
        run: |
          set -euo pipefail
          python3 -B host_candidate/p203_original_boot_parents/test_original_boot_parent_callers.py 2>&1 |
            tee "$RUNNER_TEMP/p203-test.log"
          grep -Eq '^Ran 22 tests in' "$RUNNER_TEMP/p203-test.log"
          grep -Fxq OK "$RUNNER_TEMP/p203-test.log"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("host_candidate/p203_original_boot_parents/audit_original_boot_parent_callers.py")
          compile(p.read_text(),str(p),"exec")
          s=p.read_text()
          assert '"NOT_PROVEN"' in s
          assert "P203_REAL_KOTLIN_COROUTINE_OS_ORIGIN=NOT_ATTESTED" in s
          assert '"STRUCTURAL_BLOCKED"' in s
          print("P203_SOURCE_NO_ENGINE_OR_UI_EXECUTION=PASS")
          PY
          test "$(git hash-object host_candidate/p201_original_start_owners/audit_original_start_owners.py)" = 24981c7a92bcf242e3b21136dead5d0ecfaa3e6e
          test "$(git hash-object host_candidate/p202_original_lambda_constructors/audit_original_lambda_constructors.py)" = 5e3387df031f5e0d36709b68f93f7638fb7cbbcc
          test "$(git hash-object host_candidate/p43_original_service/build_embedded_emulator_apk.sh)" = 62ad8b62d5c0bfadf7d3b98294fd8713fb8f686f
          test "$P47_NO_HOST_FALLBACK" = 1
          test "$P181_THREE_ORIGINAL_START_DENY" = 1
          test "$P49_NODE_STAGE" = 0
          test "$P51_SIDE_BY_SIDE" = 0
          test -s THIRD_PARTY_LICENSES/DSHAPP-MIT.txt
          test -s REFERENCE_PROJECTS_AND_VM_DISCLAIMER.md
          test -s host_candidate/p201_original_start_owners/README.md
          echo P203_ORIGINAL_P201_P202_FIXED_SOURCE_GATES=PASS
      - name: Reconstruct original signed v138 for read-only analysis using existing P47-deny builder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python3 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("androguard")=="4.1.4"
          print("P203_ANDROGUARD_414_PINNED=PASS")
          PY
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -s "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/d8"
          mkdir -p .p203tmp
          if ! bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh >.p203tmp/build.log 2>&1;then
            echo P203_PINNED_ORIGINAL_APK_PREP=DENY
            exit 2
          fi
          test -s .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk
          grep -Fxq 'P43_ORIGINAL_ASSETS_LIBRARIES_AND_SECONDARY_DEX=PASS_SHA' .p203tmp/build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p203tmp/build.log
          grep -Fxq 'P181_ORIGINAL_V138_THREE_ENGINE_SPAWN_SITES_NO_HOST_EXEC=PASS' .p203tmp/build.log
          grep -Fxq 'P182_ORIGINAL_V138_TYPED_DENY_BRIDGES_VERIFIED_IN_REBUILT_DEX=PASS' .p203tmp/build.log
          echo P203_ORIGINAL_V138_BINARY_READY_NO_EXECUTION=PASS
      - name: Analyze actual original four parent constructor anchors and original inbound calls
        shell: bash
        run: |
          set -euo pipefail
          python3 -B host_candidate/p203_original_boot_parents/audit_original_boot_parent_callers.py \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --report .p203tmp/redacted-upstream.json | tee "$RUNNER_TEMP/p203-proof.log"
          grep -Fxq 'P203_REAL_SIGNED_V138_PARENT_METHOD_UPSTREAM=PASS' "$RUNNER_TEMP/p203-proof.log"
          for tag in BOOT AUTO_SAFE MANUAL_SAFE OBSERVE;do
            grep -Eq "^P203_${tag}_PARENT=com\\.dsh\\.android\\." "$RUNNER_TEMP/p203-proof.log"
            grep -Eq "^P203_${tag}_DIRECT_INBOUND_CALLS=[0-9]+$" "$RUNNER_TEMP/p203-proof.log"
            grep -Fxq "P203_${tag}_ACTUAL_UI_EVENT=NOT_PROVEN" "$RUNNER_TEMP/p203-proof.log"
          done
          grep -Fxq 'P203_REAL_KOTLIN_COROUTINE_OS_ORIGIN=NOT_ATTESTED' "$RUNNER_TEMP/p203-proof.log"
          grep -Fxq 'P203_P184_RECEIPT_TO_ORIGINAL_KOTLIN=NOT_WIRED' "$RUNNER_TEMP/p203-proof.log"
          grep -Fxq 'P203_ORIGINAL_NODE_HTTP_READY=NOT_WIRED' "$RUNNER_TEMP/p203-proof.log"
          grep -Fxq 'P203_V139=STRUCTURAL_BLOCKED' "$RUNNER_TEMP/p203-proof.log"
          python3 - <<'PY'
          import json
          q=json.load(open(".p203tmp/redacted-upstream.json"))
          assert q["original_signed_v138_sha256"]=="3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5"
          assert set(q["parent_callchains"])=={"BOOT","AUTO_SAFE","MANUAL_SAFE","OBSERVE"}
          assert all(z["p202_anchor_original_verified"]
                     for z in q["parent_callchains"].values())
          assert {k:v["p202_constructor_pc"] for k,v in q["parent_callchains"].items()}=={"BOOT":26,"AUTO_SAFE":104,"MANUAL_SAFE":104,"OBSERVE":1432}
          assert q["actual_original_android_ui_interaction"] is False
          assert q["genuine_engine_manager_coroutine_invoked"] is False
          assert q["os_owner_epoch_attested"] is False
          assert q["p184_receipt_to_original_coroutine"] is False
          assert q["original_arm64_node_http_ready"] is False
          assert q["release"]=="STRUCTURAL_BLOCKED"
          print("P203_REAL_ORIGINAL_PARENT_UPSTREAM_TYPED_REPORT=PASS")
          PY
      - name: Erase original signed binary and temporary report; retain all v139 blockers
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p203tmp
          echo P203_ORIGINAL_BOOT_PARENT_UPSTREAM=CHECK_REAL_BINARY_CI >> "$GITHUB_STEP_SUMMARY"
          echo P203_REAL_USER_UI_EVENT=NOT_PROVEN >> "$GITHUB_STEP_SUMMARY"
          echo P203_ORIGINAL_KOTLIN_COROUTINE_OS_ORIGIN=NOT_ATTESTED >> "$GITHUB_STEP_SUMMARY"
          echo P203_P184_REAL_ORIGINAL_COROUTINE=NOT_WIRED >> "$GITHUB_STEP_SUMMARY"
          echo P203_ORIGINAL_ARM64_NODE_HTTP_READY=NOT_WIRED >> "$GITHUB_STEP_SUMMARY"
          echo P203_P47_HOST_PROCESSBUILDER_FALLBACK=DENY >> "$GITHUB_STEP_SUMMARY"
          echo P203_NATIVE_SENSITIVE_TOOLS=DENY_ALL >> "$GITHUB_STEP_SUMMARY"
          echo P203_GS_SCREENSHOT=OFF >> "$GITHUB_STEP_SUMMARY"
          echo P203_FINGERPRINTING_SITES_BACKGROUND_REQUESTS=NEVER >> "$GITHUB_STEP_SUMMARY"
          echo P203_REAL_PHONE_TEST=AUTHORIZED_LATER_NOT_PERFORMED >> "$GITHUB_STEP_SUMMARY"
          echo P203_DIFFERENT_SIGNER_ORIGINAL_DATA_OVERWRITE=FORBIDDEN >> "$GITHUB_STEP_SUMMARY"
          echo P203_V139=STRUCTURAL_BLOCKED >> "$GITHUB_STEP_SUMMARY"
