name: P246 read-only exception semantics synthetic classification
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p246_exception_semantics/**'
      - '.github/workflows/p246-exception-static-only.yml'
permissions:
  contents: read
concurrency:
  group: p246-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p246-static-only:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm fixed original safety hashes, run 30 synthetic negatives
        run: |
          set -euo pipefail
          test "$(git hash-object host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java)" = 44cd38245dc87b9eff960b15dc520e60a2754c2c
          test "$(git hash-object host_candidate/p43_original_service/build_embedded_emulator_apk.sh)" = 62ad8b62d5c0bfadf7d3b98294fd8713fb8f686f
          python3 - <<'PY'
          from pathlib import Path
          for s in ('p246_exception_semantics.py','test_p246_exception_semantics.py','test_p247_classifier_contract.py'):
            p=Path('host_candidate/p246_exception_semantics')/s
            compile(p.read_text(encoding='utf-8'),str(p),'exec')
          print('P246_SOURCE_SYNTAX=PASS')
          PY
          python3 -B host_candidate/p246_exception_semantics/test_p246_exception_semantics.py 2>&1 | tee "$RUNNER_TEMP/p246-tests.log"
          grep -Eq '^Ran 30 tests in' "$RUNNER_TEMP/p246-tests.log"
          grep -Fxq OK "$RUNNER_TEMP/p246-tests.log"
          python3 -B host_candidate/p246_exception_semantics/test_p247_classifier_contract.py 2>&1 | tee "$RUNNER_TEMP/p247-contract.log"
          grep -Eq '^Ran 12 tests in' "$RUNNER_TEMP/p247-contract.log"
          grep -Fxq OK "$RUNNER_TEMP/p247-contract.log"
          echo P247_P246_BYTE_CODEUNIT_AND_HANDLER_COMPLETENESS_FIXTURES=PASS
          python3 -B host_candidate/p246_exception_semantics/p246_exception_semantics.py | tee "$RUNNER_TEMP/p246-status.log"
          grep -Fxq 'P246_CANDIDATE_BYTES=NOT_RETAINED' "$RUNNER_TEMP/p246-status.log"
          grep -Fxq 'P246_REAL_EXCEPTION_DIFF=NOT_ATTESTED' "$RUNNER_TEMP/p246-status.log"
          grep -Fxq 'P246_NO_APK_ASSEMBLY_OR_RUNTIME=PASS' "$RUNNER_TEMP/p246-status.log"
          test -z "$(git status --porcelain)"
          echo P246_V139_STRUCTURAL_BLOCKED=YES
