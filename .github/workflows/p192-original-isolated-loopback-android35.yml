name: P192 real Android35 original-package isolated UID loopback capability (no Node, no release)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p192_loopback_android35/**'
      - 'host_candidate/p187_loopback_capability/**'
      - '.github/workflows/p192-original-isolated-loopback-android35.yml'
permissions:
  contents: read
concurrency:
  group: p192-original-loopback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android35-original-isolated-loopback:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P181_THREE_ORIGINAL_START_DENY: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source safety and offline negative checks
        shell: bash
        run: |
          set -euo pipefail
          test "$P47_NO_HOST_FALLBACK" = 1
          test "$P181_THREE_ORIGINAL_START_DENY" = 1
          test "$P49_NODE_STAGE" = 0
          test "$P51_SIDE_BY_SIDE" = 0
          bash -n host_candidate/p192_loopback_android35/run_p192_emulator_only.sh
          bash -n host_candidate/p192_loopback_android35/run_android35_emulator_only.sh
          bash -n host_candidate/p192_loopback_android35/run_java8.sh
          python3 - <<'PYAST'
          import ast
          from pathlib import Path
          for name in ('prepare_p187_ci.py', 'test_p187b_shell_gate.py'):
              code = Path('host_candidate/p192_loopback_android35', name).read_text()
              ast.parse(code)
          print('P192_PYTHON_AST_PARSE_NO_PYC=PASS')
          PYAST
          bash host_candidate/p192_loopback_android35/run_java8.sh
          python3 host_candidate/p192_loopback_android35/test_p187b_shell_gate.py
      - name: Patch only three verified P43 test fixture sources in ephemeral CI checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 host_candidate/p192_loopback_android35/prepare_p187_ci.py --apply-ci
          git diff --name-only | sort > .p192-actual-diff
          printf '%s\n' \
            host_candidate/p43_original_service/android/com/dsh/android/p43/P43IsolatedWorker.java \
            host_candidate/p43_original_service/android/com/dsh/android/p43/P43ProbeActivity.java \
            host_candidate/p43_original_service/build_embedded_emulator_apk.sh | sort > .p192-expected-diff
          cmp .p192-actual-diff .p192-expected-diff
          echo P192_ONLY_THREE_PINNED_P43_TEST_FIXTURE_FILES_CHANGED_IN_CI=PASS
      - name: Provision temporary original Android35 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir -r host_candidate/requirements.txt
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -s "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/d8"
      - name: Compile exact original-package ephemeral P43 APK, no fixed signing key
        shell: bash
        run: |
          set -euo pipefail
          if ! bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh >.p192_build.log 2>&1; then
            grep -E 'P43_|P47_|P76_|P187_|P192_|error:|Traceback|unbound variable|failed|Failed|exit status' .p192_build.log | tail -n 30 || true
            echo P192_BUILD_FAILED_CHECK_STAGE_AND_REQUIRED_ENV
            exit 1
          fi
          apk=.p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk
          test -s "$apk"
          grep -Fxq 'P43_ORIGINAL_ASSETS_LIBRARIES_AND_SECONDARY_DEX=PASS_SHA' .p192_build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p192_build.log
          grep -Fxq 'P181_ORIGINAL_V138_THREE_ENGINE_SPAWN_SITES_NO_HOST_EXEC=PASS' .p192_build.log
          grep -Fxq 'P182_ORIGINAL_V138_TYPED_DENY_BRIDGES_VERIFIED_IN_REBUILT_DEX=PASS' .p192_build.log
          echo P192_EPHEMERAL_ORIGINAL_P43_P187_APK_BUILD=PASS
      - name: Enable disposable emulator KVM
        shell: bash
        run: if test -c /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Real Android35 separate host and isolated UIDs localhost capability
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p192_loopback_android35/run_p192_emulator_only.sh
      - name: Destroy only ephemeral scratch and show non-release limits
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p192_build.log .p192-actual-diff .p192-expected-diff
          echo 'P192_USER_PHONE_TOUCHED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P192_PRODUCTION_NODE_SCRIPTS_EXECUTED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'P192_ORIGINAL_ENGINEMANAGER_HTTP_TOKEN_READY=NOT_TESTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'P192_HOST_PROCESSBUILDER_FALLBACK=DENY' >> "$GITHUB_STEP_SUMMARY"
          echo 'P192_NATIVE_SENSITIVE_TOOLS=DENY_ALL' >> "$GITHUB_STEP_SUMMARY"
          echo 'P192_FIXED_SIGNED_V139=BLOCKED' >> "$GITHUB_STEP_SUMMARY"