name: B0 read-only signed DSH v138 browser isolation audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/browser_isolation_audit/**'
      - '.github/workflows/b0-browser-signed-original-audit.yml'
permissions:
  contents: read
concurrency:
  group: b0-browser-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-original-dex-browser-audit:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict source preflight and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B host_candidate/browser_isolation_audit/test_audit.py 2>&1 | tee "$RUNNER_TEMP/b0-negative.log"
          grep -Eq '^Ran 8 tests in' "$RUNNER_TEMP/b0-negative.log"
          grep -Fxq 'OK' "$RUNNER_TEMP/b0-negative.log"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('host_candidate/browser_isolation_audit/audit_signed_v138.py')
          compile(p.read_text(), str(p), 'exec')
          print('B0_SOURCE_SYNTAX=PASS')
          PY
          test -s THIRD_PARTY_LICENSES/DSHAPP-MIT.txt
          test -s REFERENCE_PROJECTS_AND_VM_DISCLAIMER.md
          echo B0_NEGATIVE_TESTS=PASS
      - name: Inspect SHA-pinned signed v138 DEX without execution or user data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir 'androguard==4.1.4'
          mkdir -p .b0scratch
          gh release download dsh-baseline-v135dsh-baseline-v135 \
            --repo "$GH_REPO" \
            --pattern DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --dir .b0scratch
          original=.b0scratch/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk
          python3 -B host_candidate/browser_isolation_audit/audit_signed_v138.py "$original" \
            | tee "$RUNNER_TEMP/b0-static-proof.log"
          grep -Fxq 'B0_SIGNED_V138_SHA256_AND_SIZE=PASS' "$RUNNER_TEMP/b0-static-proof.log"
          grep -Fxq 'B0_CROSS_PROFILE_COOKIE_LOCALSTORAGE_ISOLATION=BLOCKED' "$RUNNER_TEMP/b0-static-proof.log"
          grep -Fxq 'B0_AVF_PROTECTED_VM_GUEST=NOT_ATTESTED' "$RUNNER_TEMP/b0-static-proof.log"
          grep -Fxq 'B0_APP_EXECUTED_OR_USER_DATA_READ=NO' "$RUNNER_TEMP/b0-static-proof.log"
      - name: Erase scratch and report no-release boundary
        if: always()
        shell: bash
        run: |
          rm -rf .b0scratch
          echo B0_SIGNED_V138_STATIC_ONLY=CHECK_ABOVE >> "$GITHUB_STEP_SUMMARY"
          echo B0_RUNTIME_COOKIE_LOCALSTORAGE_ISOLATION=NOT_ATTESTED >> "$GITHUB_STEP_SUMMARY"
          echo B0_WORK_PROFILE_VIRTUAL_MACHINE=NOT_ATTESTED >> "$GITHUB_STEP_SUMMARY"
          echo B0_AI_BROWSER=DEFERRED >> "$GITHUB_STEP_SUMMARY"
          echo B0_USER_APP_DATA_READ=NO >> "$GITHUB_STEP_SUMMARY"
          echo B0_P47_HOST_PROCESSBUILDER_FALLBACK=DENY >> "$GITHUB_STEP_SUMMARY"
          echo B0_GS_CAPTURE=OFF >> "$GITHUB_STEP_SUMMARY"
          echo B0_V139_RELEASE=STRUCTURAL_BLOCKED >> "$GITHUB_STEP_SUMMARY"
