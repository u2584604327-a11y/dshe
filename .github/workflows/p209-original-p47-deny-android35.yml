          grep -Fxq OK "$RUNNER_TEMP/p209-unit.log"
          python3 -B host_candidate/p209_original_p47_deny/test_audit_signed_process_prelaunch.py 2>&1 | tee "$RUNNER_TEMP/p209-static-unit.log"
          grep -Eq '^Ran 5 tests in' "$RUNNER_TEMP/p209-static-unit.log"
