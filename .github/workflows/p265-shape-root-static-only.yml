name: P265 source-only original operand-shape subcategory correlation
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p265_operand_shape/**'
      - '.github/workflows/p265-shape-root-static-only.yml'
permissions:
  contents: read
concurrency:
  group: p265-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p265-static-only:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed original safety seals and 331 synthetic tests
        run: |
          set -euo pipefail
          test "$(git hash-object host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java)" = 44cd38245dc87b9eff960b15dc520e60a2754c2c
          test "$(git hash-object host_candidate/p43_original_service/build_embedded_emulator_apk.sh)" = 62ad8b62d5c0bfadf7d3b98294fd8713fb8f686f
          test "$(git hash-object host_candidate/p245_build_only_probe/p245_build_only_probe.py)" = 06f62f4d8c8ee141b6b2030ee6556c9a43d9e499
          test "$(git hash-object host_candidate/p246_exception_semantics/p246_exception_semantics.py)" = 59e64268fe80ceec0169417b83e96772b3e015a0
          test "$(git hash-object host_candidate/p249_dual_diff/p249_dual_diff.py)" = 44248b92504cbf6d3406ffdccbde61e1099dcc7f
          test "$(git hash-object host_candidate/p251_method_relation/p251_method_relation.py)" = 136289c3d270d130270ce0b648070996df73b14a
          test "$(git hash-object host_candidate/p253_cfg_ordinal/p253_cfg_ordinal.py)" = 9ff606e656fce61eb11c83e3dd4b2ab93385f7e0
          test "$(git hash-object host_candidate/p255_branch_separation/p255_branch_separation.py)" = 5b19da4d967ca79ea77f26c6e463fb39c0a6fae1
          test "$(git hash-object host_candidate/p257_opcode_family/p257_opcode_family.py)" = 5afdef13bd3999744be931c457d3b514fd1459e2
          test "$(git hash-object host_candidate/p259_all_operands/p259_all_operands.py)" = f4b383766a10a4c14795bc3f3d4c5f2a2a52a099
          test "$(git hash-object host_candidate/p261_all_method_census/p261_all_method_census.py)" = d4724ef5045857b6583a27251171ea4e3f1413e9
          test "$(git hash-object host_candidate/p263_operand_correlation/p263_operand_correlation.py)" = 6ce541aa73300795b5866fabd3b469d7655a1ed0
          test "$(git hash-object host_candidate/p265_operand_shape/p265_operand_shape.py)" = c73d09ab7efa2503a542c0a0a21bbbe33c95a360
          python3 - <<'PY'
          from pathlib import Path
          for filename in ('p253_cfg_ordinal.py','test_p253_cfg_ordinal.py'):
            p=Path('host_candidate/p253_cfg_ordinal')/filename
            compile(p.read_text(encoding='utf8'),str(p),'exec')
          print('P253_SOURCE_SYNTAX=PASS')
          PY
          python3 -B host_candidate/p245_build_only_probe/test_p245_build_only_probe.py > "$RUNNER_TEMP/p253-p245.log" 2>&1
          grep -Eq '^Ran 15 tests in' "$RUNNER_TEMP/p253-p245.log"
          grep -Fxq OK "$RUNNER_TEMP/p253-p245.log"
          python3 -B host_candidate/p246_exception_semantics/test_p246_exception_semantics.py > "$RUNNER_TEMP/p253-p246.log" 2>&1
          grep -Eq '^Ran 30 tests in' "$RUNNER_TEMP/p253-p246.log"
          grep -Fxq OK "$RUNNER_TEMP/p253-p246.log"
          python3 -B host_candidate/p246_exception_semantics/test_p247_classifier_contract.py > "$RUNNER_TEMP/p253-p247.log" 2>&1
          grep -Eq '^Ran 12 tests in' "$RUNNER_TEMP/p253-p247.log"
          grep -Fxq OK "$RUNNER_TEMP/p253-p247.log"
          python3 -B host_candidate/p249_dual_diff/test_p249_dual_diff.py > "$RUNNER_TEMP/p253-p249.log" 2>&1
          grep -Eq '^Ran 26 tests in' "$RUNNER_TEMP/p253-p249.log"
          grep -Fxq OK "$RUNNER_TEMP/p253-p249.log"
          python3 -B host_candidate/p251_method_relation/test_p251_method_relation.py > "$RUNNER_TEMP/p253-p251.log" 2>&1
          grep -Eq '^Ran 32 tests in' "$RUNNER_TEMP/p253-p251.log"
          grep -Fxq OK "$RUNNER_TEMP/p253-p251.log"
          python3 -B host_candidate/p253_cfg_ordinal/test_p253_cfg_ordinal.py 2>&1 | tee "$RUNNER_TEMP/p253-current.log"
          grep -Eq '^Ran 30 tests in' "$RUNNER_TEMP/p253-current.log"
          grep -Fxq OK "$RUNNER_TEMP/p253-current.log"
          python3 -B host_candidate/p255_branch_separation/test_p255_branch_separation.py 2>&1 | tee "$RUNNER_TEMP/p255-current.log"
          grep -Eq '^Ran 22 tests in' "$RUNNER_TEMP/p255-current.log"
          grep -Fxq OK "$RUNNER_TEMP/p255-current.log"
          python3 -B host_candidate/p257_opcode_family/test_p257_opcode_family.py 2>&1 | tee "$RUNNER_TEMP/p257-current.log"
          grep -Eq '^Ran 36 tests in' "$RUNNER_TEMP/p257-current.log"
          grep -Fxq OK "$RUNNER_TEMP/p257-current.log"
          python3 -B host_candidate/p259_all_operands/test_p259_all_operands.py 2>&1 | tee "$RUNNER_TEMP/p259-new.log"
          grep -Eq '^Ran 38 tests in' "$RUNNER_TEMP/p259-new.log"
          grep -Fxq OK "$RUNNER_TEMP/p259-new.log"
          python3 -B host_candidate/p261_all_method_census/test_p261_all_method_census.py 2>&1 | tee "$RUNNER_TEMP/p261-tests.log"
          grep -Eq '^Ran 36 tests in' "$RUNNER_TEMP/p261-tests.log"
          grep -Fxq OK "$RUNNER_TEMP/p261-tests.log"
          python3 -B host_candidate/p263_operand_correlation/test_p263_operand_correlation.py 2>&1 | tee "$RUNNER_TEMP/p263-test.log"
          grep -Eq '^Ran 26 tests in' "$RUNNER_TEMP/p263-test.log"
          grep -Fxq OK "$RUNNER_TEMP/p263-test.log"
          python3 -B host_candidate/p265_operand_shape/test_p265_operand_shape.py 2>&1 | tee "$RUNNER_TEMP/p265-current.log"
          grep -Eq '^Ran 28 tests in' "$RUNNER_TEMP/p265-current.log"
          grep -Fxq OK "$RUNNER_TEMP/p265-current.log"
          echo P265_P245_15_P246_30_P247_12_P249_26_P251_32_P253_30_P255_22_P257_36_P259_38_P261_36_P263_26_P265_28=PASS
          python3 -B host_candidate/p265_operand_shape/p265_operand_shape.py | tee "$RUNNER_TEMP/p265-source-only.log"
          grep -Fxq 'P265_SOURCE_ONLY=YES' "$RUNNER_TEMP/p265-source-only.log"
          grep -Fxq 'P265_REAL_SHAPE_CAUSE=NOT_ATTESTED' "$RUNNER_TEMP/p265-source-only.log"
          grep -Fxq 'P265_NO_APK_BUILD_INSTALL_OR_RELEASE=YES' "$RUNNER_TEMP/p265-source-only.log"
          grep -Fxq 'P265_V139=STRUCTURAL_BLOCKED' "$RUNNER_TEMP/p265-source-only.log"
          test -z "$(git status --porcelain)"
          echo P265_NO_APK_ASSEMBLY_ADB_EMULATOR_RELEASE_OR_USER_DATA=PASS
