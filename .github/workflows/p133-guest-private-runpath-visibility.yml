name: P133 guest private RUNPATH visibility vs guest linker (offline)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p133_guest_private_runpath_visibility.sh'
      - '.github/workflows/p133-guest-private-runpath-visibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p133-original-node-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-node-absolute-runpath:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned v138 source SHA and original c-ares provenance
        run: |
          set -euo pipefail
          bash -n host_candidate/p133_guest_private_runpath_visibility.sh
          mkdir -p "$RUNNER_TEMP/p133-apk"
          gh release download dsh-baseline-v135dsh-baseline-v135 --repo "$GH_REPO" --pattern DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk --dir "$RUNNER_TEMP/p133-apk"
          printf "%s  %s\n" 3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5 "$RUNNER_TEMP/p133-apk/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk" | sha256sum -c -
          python3 host_candidate/p127_google_apis_nativebridge_original_node_stage.py "$RUNNER_TEMP/p133-apk/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk" "$RUNNER_TEMP/p133-stage"
          echo "P133_STAGE=$RUNNER_TEMP/p133-stage" >> "$GITHUB_ENV"
      - name: Preflight matching absolute and origin synthetic guest RUNPATH
        run: P133_COMPILE_ONLY=1 bash host_candidate/p133_guest_private_runpath_visibility.sh "$P133_STAGE"
      - name: Enable KVM for disposable emulator only
        run: if test -c /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Probe shell path visibility versus two synthetic guest ELF runpaths
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: P133_COMPILE_ONLY=0 bash host_candidate/p133_guest_private_runpath_visibility.sh "$P133_STAGE"
      - name: Always clear temporary inputs and preserve release deny gate
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/p133-apk" "$RUNNER_TEMP/p133-stage"
          echo P133_ORIGINAL_ISOLATED_UID=NOT_TESTED >> "$GITHUB_STEP_SUMMARY"
          echo P133_SHELL_PRIVATE_PATH_VS_LINKER=DIAGNOSTIC_ONLY >> "$GITHUB_STEP_SUMMARY"
          echo P133_P109_SENSITIVE_TOOL_AUTHORITY=DENY_ALL >> "$GITHUB_STEP_SUMMARY"
          echo P133_FORMAL_V139_RELEASE=BLOCKED >> "$GITHUB_STEP_SUMMARY"
