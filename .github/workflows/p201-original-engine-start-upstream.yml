name: P201 fixed signed-v138 real EngineManager 8-callsite upstream event provenance (read only)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p201_original_start_owners/**'
      - '.github/workflows/p201-original-engine-start-upstream.yml'
permissions:
  contents: read
concurrency:
  group: p201-original-start-owners-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned-original-v138-static-upstream:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P181_THREE_ORIGINAL_START_DENY: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict 19 synthetic negative cases and immutable original provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 -B host_candidate/p201_original_start_owners/test_original_start_owners.py 2>&1 |
            tee "$RUNNER_TEMP/p201-tests.log"
          grep -Eq '^Ran 19 tests in' "$RUNNER_TEMP/p201-tests.log"
          grep -Fxq 'OK' "$RUNNER_TEMP/p201-tests.log"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("host_candidate/p201_original_start_owners/audit_original_start_owners.py")
          compile(p.read_text(),str(p),"exec")
          s=p.read_text()
          assert 'original_engine_coroutine_os_source_attested' in s
          assert '"NOT_ATTESTED"' in s
          assert '"NOT_PROVEN"' in s
          print("P201_STATIC_UPSTREAM_ONLY_NO_RUNTIME_TRUST=PASS")
          PY
          test "$(git hash-object host_candidate/p198_original_source/audit_entry_callers.py)" = 089dd16afb6ff7bf7c9092ee0e41346b77823570
          test "$(git hash-object host_candidate/p196_dex_lifecycle/audit_exact_v138_dex.py)" = 4236ec6db86402ff10947d33266fd21018d196ac
          test "$(git hash-object host_candidate/p43_original_service/build_embedded_emulator_apk.sh)" = 62ad8b62d5c0bfadf7d3b98294fd8713fb8f686f
          test "$P47_NO_HOST_FALLBACK" = 1
          test "$P181_THREE_ORIGINAL_START_DENY" = 1
          test "$P49_NODE_STAGE" = 0
          test "$P51_SIDE_BY_SIDE" = 0
          test -s THIRD_PARTY_LICENSES/DSHAPP-MIT.txt
          test -s REFERENCE_PROJECTS_AND_VM_DISCLAIMER.md
          test -s host_candidate/p198_original_source/BROWSER_PRIVACY_QA.md
          echo P201_ORIGINAL_PINNED_READONLY_NO_NODE_OR_SENSITIVE_DATA=PASS
      - name: Prepare exact original signed v138 via existing P43 deny-only build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python3 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("androguard")=="4.1.4"
          print("P201_ANDROGUARD_414_PINNED=PASS")
          PY
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -s "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/d8"
          mkdir -p .p201tmp
          if ! bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh >.p201tmp/build.log 2>&1;then
            echo P201_ORIGINAL_V138_DENY_ONLY_BUILD_FAILED
            exit 2
          fi
          test -s .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk
          grep -Fxq 'P43_ORIGINAL_ASSETS_LIBRARIES_AND_SECONDARY_DEX=PASS_SHA' .p201tmp/build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p201tmp/build.log
          grep -Fxq 'P181_ORIGINAL_V138_THREE_ENGINE_SPAWN_SITES_NO_HOST_EXEC=PASS' .p201tmp/build.log
          grep -Fxq 'P182_ORIGINAL_V138_TYPED_DENY_BRIDGES_VERIFIED_IN_REBUILT_DEX=PASS' .p201tmp/build.log
          echo P201_REAL_SIGNED_V138_SOURCE_READY_NO_EXECUTION=PASS
      - name: Prove eight exact direct callsites and bounded upstream methods in original DEX
        shell: bash
        run: |
          set -euo pipefail
          python3 -B host_candidate/p201_original_start_owners/audit_original_start_owners.py \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --report .p201tmp/sanitized-calls.json |
            tee "$RUNNER_TEMP/p201-proof.log"
          grep -Fxq 'P201_ORIGINAL_SIGNED_V138_STATIC_CALLCHAIN=PASS' "$RUNNER_TEMP/p201-proof.log"
          grep -Fxq 'P201_MAIN_DIRECT_CALLSITES=4' "$RUNNER_TEMP/p201-proof.log"
          grep -Fxq 'P201_PROBE_DIRECT_CALLSITES=1' "$RUNNER_TEMP/p201-proof.log"
          grep -Fxq 'P201_CONFIG_DIRECT_CALLSITES=3' "$RUNNER_TEMP/p201-proof.log"
          grep -Fxq 'P201_REAL_ORIGINAL_KOTLIN_COROUTINE_OS_IDENTITY=NOT_ATTESTED' "$RUNNER_TEMP/p201-proof.log"
          grep -Fxq 'P201_ORIGINAL_P184_RECEIPT_TO_REAL_COROUTINE=NOT_WIRED' "$RUNNER_TEMP/p201-proof.log"
          grep -Fxq 'P201_ORIGINAL_ARM64_NODE_HTTP_TOKEN_READY=NOT_WIRED' "$RUNNER_TEMP/p201-proof.log"
          grep -Fxq 'P201_V139=STRUCTURAL_BLOCKED' "$RUNNER_TEMP/p201-proof.log"
          python3 - <<'PY'
          import json
          r=json.load(open(".p201tmp/sanitized-calls.json"))
          assert r["original_sha256"]=="3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5"
          assert {k:len(v) for k,v in r["entry_modes"].items()}=={"MAIN":4,"PROBE":1,"CONFIG":3}
          assert all(e["event_executed"]=="NOT_PROVEN"
                     and e["coroutine_os_identity"]=="NOT_ATTESTED"
                     for es in r["entry_modes"].values() for e in es)
          assert r["true_android_ui_event_executed"] is False
          assert r["original_engine_coroutine_os_source_attested"] is False
          assert r["p184_original_coroutine_handoff_proven"] is False
          assert r["original_node_http_ready"] is False
          assert r["production_release"]=="STRUCTURAL_BLOCKED"
          print("P201_ORIGINAL_EIGHT_CALLSITE_REDACTED_UPSTREAM_REPORT=PASS")
          PY
          echo P201_EXACT_ORIGINAL_UI_EVENT_SIGNATURES_STATIC_ONLY=PASS
      - name: Erase signed original APK and all test scratch without artifact uploads
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p201tmp
          echo P201_REAL_SIGNED_ORIGINAL_EIGHT_CALLSITES=CHECK_ANALYSIS_JOB >> "$GITHUB_STEP_SUMMARY"
          echo P201_REAL_ANDROID_EVENT_DISPATCH_OR_COROUTINE=NOT_PROVEN >> "$GITHUB_STEP_SUMMARY"
          echo P201_ORIGINAL_P184_RECEIPT_TO_KOTLIN_COROUTINE=NOT_WIRED >> "$GITHUB_STEP_SUMMARY"
          echo P201_ARM64_NODE_FD_JS_NATIVE_HTTP_READY=NOT_WIRED >> "$GITHUB_STEP_SUMMARY"
          echo P201_HOST_PROCESSBUILDER_FALLBACK=DENY >> "$GITHUB_STEP_SUMMARY"
          echo P201_NATIVE_SENSITIVE_TOOLS=DENY_ALL >> "$GITHUB_STEP_SUMMARY"
          echo P201_GS_SCREENSHOT=OFF >> "$GITHUB_STEP_SUMMARY"
          echo P201_FINGERPRINT_SITES_BACKGROUND_REQUEST=NEVER >> "$GITHUB_STEP_SUMMARY"
          echo P201_REAL_PHONE_TEST=AUTHORIZED_LATER_NOT_PERFORMED >> "$GITHUB_STEP_SUMMARY"
          echo P201_EPHEMERAL_DIFFERENT_SIGNER_INPLACE_UPGRADE=FORBIDDEN >> "$GITHUB_STEP_SUMMARY"
          echo P201_FORMAL_V139=STRUCTURAL_BLOCKED >> "$GITHUB_STEP_SUMMARY"
