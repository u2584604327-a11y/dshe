name: P204 exact signed-v138 MainActivity.onCreate PC430 normal control-flow guards
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p204_oncreate_pc430/**'
      - '.github/workflows/p204-oncreate-pc430-cfg.yml'
permissions:
  contents: read
concurrency:
  group: p204-original-pc430-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-original-branch-structure-only:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P181_THREE_ORIGINAL_START_DENY: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline 25 conservative CFG tests and immutable original source hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B host_candidate/p204_oncreate_pc430/test_original_oncreate_pc430.py 2>&1 | tee "$RUNNER_TEMP/p204-tests.log"
          grep -Eq '^Ran 25 tests in' "$RUNNER_TEMP/p204-tests.log"
          grep -Fxq OK "$RUNNER_TEMP/p204-tests.log"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("host_candidate/p204_oncreate_pc430/audit_original_oncreate_pc430.py")
          compile(p.read_text(),str(p),'exec')
          s=p.read_text()
          assert "P204_PC430_ACTUAL_ANDROID_EXECUTION=NOT_OBSERVED" in s
          assert "P204_REAL_COROUTINE_OS_OWNER=NOT_ATTESTED" in s
          assert "P204_ORIGINAL_NODE_HTTP_READY=NOT_WIRED" in s
          assert "2*d" in s
          print("P204_SOURCE_NO_FALSE_RUNTIME_ORIGINATION=PASS")
          PY
          test "$(git hash-object host_candidate/p201_original_start_owners/audit_original_start_owners.py)" = 24981c7a92bcf242e3b21136dead5d0ecfaa3e6e
          test "$(git hash-object host_candidate/p203_original_boot_parents/audit_original_boot_parent_callers.py)" = 85598b4d75bc6a6c0deb3eaa543fb27f6bb905c6
          test "$(git hash-object host_candidate/p43_original_service/build_embedded_emulator_apk.sh)" = 62ad8b62d5c0bfadf7d3b98294fd8713fb8f686f
          test "$P47_NO_HOST_FALLBACK" = 1
          test "$P181_THREE_ORIGINAL_START_DENY" = 1
          test "$P49_NODE_STAGE" = 0
          test "$P51_SIDE_BY_SIDE" = 0
          test -s THIRD_PARTY_LICENSES/DSHAPP-MIT.txt
          test -s REFERENCE_PROJECTS_AND_VM_DISCLAIMER.md
          echo P204_PINNED_ORIGINAL_AND_BRANCH_TEST_GATES=PASS
      - name: Prepare original signed v138 through existing DENY-only test builder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python3 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("androguard")=="4.1.4"
          print("P204_PINNED_ANDROGUARD=PASS")
          PY
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -s "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/d8"
          mkdir -p .p204tmp
          if ! bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh >.p204tmp/build.log 2>&1; then
            echo P204_FIXED_ORIGINAL_DENY_ONLY_PREP=DENY
            exit 2
          fi
          test -s .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk
          grep -Fxq 'P43_ORIGINAL_ASSETS_LIBRARIES_AND_SECONDARY_DEX=PASS_SHA' .p204tmp/build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p204tmp/build.log
          grep -Fxq 'P181_ORIGINAL_V138_THREE_ENGINE_SPAWN_SITES_NO_HOST_EXEC=PASS' .p204tmp/build.log
          grep -Fxq 'P182_ORIGINAL_V138_TYPED_DENY_BRIDGES_VERIFIED_IN_REBUILT_DEX=PASS' .p204tmp/build.log
          echo P204_EXACT_SIGNED_ORIGINAL_READY_WITHOUT_EXECUTION=PASS
      - name: Audit original MainActivity.onCreate PC430 exact bootEngine and conditional normal edges
        shell: bash
        run: |
          set -euo pipefail
          python3 -B host_candidate/p204_oncreate_pc430/audit_original_oncreate_pc430.py \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --report .p204tmp/redacted.json | tee "$RUNNER_TEMP/p204-proof.log"
          grep -Fxq 'P204_ORIGINAL_ONCREATE_PC430_EXACT_INVOKE=PASS' "$RUNNER_TEMP/p204-proof.log"
          grep -Eq '^P204_PC430_NORMAL_CFG=(REACHABLE_IN_CONSERVATIVE_CFG|NOT_REACHED_IN_MODELED_CFG)$' "$RUNNER_TEMP/p204-proof.log"
          grep -Eq '^P204_POTENTIAL_GUARD_COUNT=[0-9]+$' "$RUNNER_TEMP/p204-proof.log"
          grep -Fxq 'P204_PC430_ACTUAL_ANDROID_EXECUTION=NOT_OBSERVED' "$RUNNER_TEMP/p204-proof.log"
          grep -Fxq 'P204_REAL_COROUTINE_OS_OWNER=NOT_ATTESTED' "$RUNNER_TEMP/p204-proof.log"
          grep -Fxq 'P204_ORIGINAL_P184_RECEIPT=NOT_WIRED' "$RUNNER_TEMP/p204-proof.log"
          grep -Fxq 'P204_ORIGINAL_NODE_HTTP_READY=NOT_WIRED' "$RUNNER_TEMP/p204-proof.log"
          grep -Fxq 'P204_V139=STRUCTURAL_BLOCKED' "$RUNNER_TEMP/p204-proof.log"
          python3 - <<'PY'
          import json
          q=json.load(open(".p204tmp/redacted.json"))
          assert q["original_signed_v138_sha256"]=="3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5"
          assert q["callsite_pc"]==430
          assert q["method"]=="MainActivity.onCreate(Bundle)"
          assert q["call_target"]=="MainActivity.bootEngine"
          assert q["original_android_pc430_executed"]=="NOT_OBSERVED"
          assert q["original_coroutine_os_owner_generation"]=="NOT_ATTESTED"
          assert q["original_p184_receipt_to_coroutine"]=="NOT_WIRED"
          assert q["original_arm64_node_http_ready"]=="NOT_WIRED"
          assert q["release"]=="STRUCTURAL_BLOCKED"
          assert len(q["possible_conditions_bypassing_callsite"])<=20
          print("P204_ACTUAL_ORIGINAL_PC430_CFG_BRANCH_REPORT=PASS")
          PY
      - name: Erase disposable signed original binaries and reports
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p204tmp
          echo P204_ORIGINAL_PC430_BRANCH_STRUCTURE=CHECK_EXACT_BINARY_JOB >> "$GITHUB_STEP_SUMMARY"
          echo P204_ACTUAL_ONCREATE_PC430_EXECUTION=NOT_OBSERVED >> "$GITHUB_STEP_SUMMARY"
          echo P204_SWITCH_OR_EXCEPTION_BRANCHES=NOT_FULLY_MODELED >> "$GITHUB_STEP_SUMMARY"
          echo P204_REAL_COROUTINE_OS_OWNER=NOT_ATTESTED >> "$GITHUB_STEP_SUMMARY"
          echo P204_P184_RECEIPT_TO_ORIGINAL_KOTLIN=NOT_WIRED >> "$GITHUB_STEP_SUMMARY"
          echo P204_ARM64_NODE_HTTP_READY=NOT_WIRED >> "$GITHUB_STEP_SUMMARY"
          echo P204_P47_HOST_PROCESSBUILDER_FALLBACK=DENY >> "$GITHUB_STEP_SUMMARY"
          echo P204_NATIVE_SENSITIVE_TOOLS=DENY_ALL >> "$GITHUB_STEP_SUMMARY"
          echo P204_GS_SCREENSHOT=OFF >> "$GITHUB_STEP_SUMMARY"
          echo P204_FINGERPRINT_SITES_AUTO_TESTED=NO >> "$GITHUB_STEP_SUMMARY"
          echo P204_REAL_PHONE_TEST=FUTURE_USER_CONSENT_ONLY >> "$GITHUB_STEP_SUMMARY"
          echo P204_ORIGINAL_USER_DATA_MODIFICATION=NONE >> "$GITHUB_STEP_SUMMARY"
          echo P204_V139=STRUCTURAL_BLOCKED >> "$GITHUB_STEP_SUMMARY"
