name: P268 one-shot original invoke-argument word-sequence audit with intact P245 deny
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/p268-operand-shape-one-shot.yml'
permissions:
  contents: read
concurrency:
  group: p268-one-shot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p268-operand-shape:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P181_THREE_ORIGINAL_START_DENY: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
      P208_CI_METHOD_ENTRY_ONLY: '1'
      P209_FINAL_DENY_ONLY: '1'
      P74_FIXTURE_ENGINE_BRIDGE: '0'
      P75_RENDEZVOUS_FIXTURE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python source syntax and 15 fail-closed tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for n in ('p245_build_only_probe.py','test_p245_build_only_probe.py'):
            p=Path('host_candidate/p245_build_only_probe')/n
            compile(p.read_text(),str(p),'exec')
          print('P245_SOURCE_SYNTAX=PASS')
          PY
          python3 -B host_candidate/p245_build_only_probe/test_p245_build_only_probe.py 2>&1 | tee "$RUNNER_TEMP/p245-unit.log"
          grep -Eq '^Ran 15 tests in' "$RUNNER_TEMP/p245-unit.log"
          grep -Fxq OK "$RUNNER_TEMP/p245-unit.log"
          python3 -B host_candidate/p246_exception_semantics/test_p246_exception_semantics.py > "$RUNNER_TEMP/p268-p246-test.log" 2>&1
          grep -Eq '^Ran 30 tests in' "$RUNNER_TEMP/p268-p246-test.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p246-test.log"
          python3 -B host_candidate/p246_exception_semantics/test_p247_classifier_contract.py > "$RUNNER_TEMP/p268-p247-test.log" 2>&1
          grep -Eq '^Ran 12 tests in' "$RUNNER_TEMP/p268-p247-test.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p247-test.log"
          python3 -B host_candidate/p249_dual_diff/test_p249_dual_diff.py > "$RUNNER_TEMP/p268-p249-unit.log" 2>&1
          grep -Eq '^Ran 26 tests in' "$RUNNER_TEMP/p268-p249-unit.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p249-unit.log"
          test "$(git hash-object host_candidate/p251_method_relation/p251_method_relation.py)" = 136289c3d270d130270ce0b648070996df73b14a
          python3 -B host_candidate/p251_method_relation/test_p251_method_relation.py > "$RUNNER_TEMP/p268-p251-fixture.log" 2>&1
          grep -Eq '^Ran 32 tests in' "$RUNNER_TEMP/p268-p251-fixture.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p251-fixture.log"
          test "$(git hash-object host_candidate/p253_cfg_ordinal/p253_cfg_ordinal.py)" = 9ff606e656fce61eb11c83e3dd4b2ab93385f7e0
          python3 -B host_candidate/p253_cfg_ordinal/test_p253_cfg_ordinal.py > "$RUNNER_TEMP/p268-p253-fixtures.log" 2>&1
          grep -Eq '^Ran 30 tests in' "$RUNNER_TEMP/p268-p253-fixtures.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p253-fixtures.log"
          test "$(git hash-object host_candidate/p255_branch_separation/p255_branch_separation.py)" = 5b19da4d967ca79ea77f26c6e463fb39c0a6fae1
          python3 -B host_candidate/p255_branch_separation/test_p255_branch_separation.py > "$RUNNER_TEMP/p268-p255-unit.log" 2>&1
          grep -Eq '^Ran 22 tests in' "$RUNNER_TEMP/p268-p255-unit.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p255-unit.log"
          test "$(git hash-object host_candidate/p257_opcode_family/p257_opcode_family.py)" = 5afdef13bd3999744be931c457d3b514fd1459e2
          python3 -B host_candidate/p257_opcode_family/test_p257_opcode_family.py > "$RUNNER_TEMP/p268-p257-fixtures.log" 2>&1
          grep -Eq '^Ran 36 tests in' "$RUNNER_TEMP/p268-p257-fixtures.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p257-fixtures.log"
          test "$(git hash-object host_candidate/p259_all_operands/p259_all_operands.py)" = f4b383766a10a4c14795bc3f3d4c5f2a2a52a099
          python3 -B host_candidate/p259_all_operands/test_p259_all_operands.py > "$RUNNER_TEMP/p268-p259-fixtures.log" 2>&1
          grep -Eq '^Ran 38 tests in' "$RUNNER_TEMP/p268-p259-fixtures.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p259-fixtures.log"
          test "$(git hash-object host_candidate/p261_all_method_census/p261_all_method_census.py)" = d4724ef5045857b6583a27251171ea4e3f1413e9
          python3 -B host_candidate/p261_all_method_census/test_p261_all_method_census.py > "$RUNNER_TEMP/p268-p261-unit.log" 2>&1
          grep -Eq '^Ran 36 tests in' "$RUNNER_TEMP/p268-p261-unit.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p261-unit.log"
          test "$(git hash-object host_candidate/p263_operand_correlation/p263_operand_correlation.py)" = 6ce541aa73300795b5866fabd3b469d7655a1ed0
          python3 -B host_candidate/p263_operand_correlation/test_p263_operand_correlation.py > "$RUNNER_TEMP/p268-p263-fixtures.log" 2>&1
          grep -Eq '^Ran 26 tests in' "$RUNNER_TEMP/p268-p263-fixtures.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p263-fixtures.log"
          test "$(git hash-object host_candidate/p265_operand_shape/p265_operand_shape.py)" = c73d09ab7efa2503a542c0a0a21bbbe33c95a360
          python3 -B host_candidate/p265_operand_shape/test_p265_operand_shape.py > "$RUNNER_TEMP/p268-p265-fixtures.log" 2>&1
          grep -Eq '^Ran 28 tests in' "$RUNNER_TEMP/p268-p265-fixtures.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p265-fixtures.log"
          test "$(git hash-object host_candidate/p267_invoke_words/p267_invoke_words.py)" = 36b295a65ef1063f9a68a1b2e8ca60c0fddf98f1
          python3 -B host_candidate/p267_invoke_words/test_p267_invoke_words.py > "$RUNNER_TEMP/p268-p267-fixtures.log" 2>&1
          grep -Eq '^Ran 31 tests in' "$RUNNER_TEMP/p268-p267-fixtures.log"
          grep -Fxq OK "$RUNNER_TEMP/p268-p267-fixtures.log"
          echo P268_SYNTHETIC_P245_15_P246_30_P247_12_P249_26_P251_32_P253_30_P255_22_P257_36_P259_38_P261_36_P263_26_P265_28_P267_31=PASS
          test "$(git hash-object host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java)" = 44cd38245dc87b9eff960b15dc520e60a2754c2c
          test "$(git hash-object host_candidate/p43_original_service/build_embedded_emulator_apk.sh)" = 62ad8b62d5c0bfadf7d3b98294fd8713fb8f686f
      - name: Prepare existing P208 P209 temporary builder
        run: |
          set -euo pipefail
          python3 host_candidate/p208_original_start_coroutine/patch_ci_only.py --prepare-builder
          python3 host_candidate/p209_original_p47_deny/patch_gate_ci_only.py --prepare
          test -s .p209tmp/P47LaunchGate.java
      - name: Prepare pinned Android35 build tools
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python3 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('androguard')=='4.1.4'
          PY
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
      - name: Build original-pinned disposable baseline without install
        run: |
          set -euo pipefail
          mkdir -p .p208tmp .p245tmp
          bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh > .p208tmp/p245-build.log 2>&1 || { tail -n 20 .p208tmp/p245-build.log; exit 2; }
          grep -Fxq 'P209_PC176_POST_THROWONFAILURE_ONLY_REVERSIBLE_MARKER=PASS' .p208tmp/p245-build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p208tmp/p245-build.log
          grep -Fxq 'P181_ORIGINAL_V138_THREE_ENGINE_SPAWN_SITES_NO_HOST_EXEC=PASS' .p208tmp/p245-build.log
          python3 host_candidate/p209_original_p47_deny/verify_original_precall.py \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk > .p245tmp/p209.log
          grep -Fxq 'P209_ALL_ORIGINAL_BRANCH_TARGETS_RELOCATED_EXACTLY=PASS' .p245tmp/p209.log
          python3 -B host_candidate/p209_original_p47_deny/p244_signed_postreturn_slot_feasibility.py \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk > .p245tmp/p244.log
          grep -Fxq 'P244_35C_TO_3RC_SAME_WIDTH_ENCODING_CANDIDATE=YES' .p245tmp/p244.log
      - name: One-shot P245 replay and dual independent DENY verification
        run: |
          set -euo pipefail
          # Never run ADB, install, start Android/Node, or persist an APK artifact.
          trap 'python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py --restore >/dev/null 2>&1 || true' EXIT
          python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py --patch
          apktool b .p43tmp/decoded -o .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-assembly.log 2>&1
          echo P268_IDENTICAL_P245_EPHEMERAL_SMALI_ASSEMBLY=PASS
          python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py --restore
          trap - EXIT
          python3 - <<'PY'
          import zipfile
          b='.p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk'
          c='.p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk'
          with zipfile.ZipFile(b) as base,zipfile.ZipFile(c,'a') as candidate:
            assert 'classes3.dex' not in candidate.namelist()
            candidate.writestr('classes3.dex',base.read('classes3.dex'),compress_type=zipfile.ZIP_STORED)
          print('P268_P245_VERBATIM_THIRD_DEX=PASS')
          PY
          # Both real checks MUST run. Always sanitize logs: only fixed deny
          # categories may be sent to public CI, never app method names.
          set +e
          python3 -B host_candidate/p249_dual_diff/p249_dual_diff.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-first-diff.log 2>&1
          classifier_rc=$?
          python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py \
            --verify .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-original-gate.log 2>&1
          p245_rc=$?
          python3 -B host_candidate/p251_method_relation/p251_method_relation.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-method-identity.log 2>&1
          p251_rc=$?
          python3 -B host_candidate/p253_cfg_ordinal/p253_cfg_ordinal.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-cfg-first-size.log 2>&1
          p253_rc=$?
          python3 -B host_candidate/p255_branch_separation/p255_branch_separation.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-branch-signature.log 2>&1
          p255_rc=$?
          python3 -B host_candidate/p257_opcode_family/p257_opcode_family.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-opcode-operand.log 2>&1
          p257_rc=$?
          python3 -B host_candidate/p259_all_operands/p259_all_operands.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-all-operands.log 2>&1
          p259_rc=$?
          python3 -B host_candidate/p261_all_method_census/p261_all_method_census.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-all-methods.log 2>&1
          p261_rc=$?
          python3 -B host_candidate/p263_operand_correlation/p263_operand_correlation.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-divergence-correlation.log 2>&1
          p263_rc=$?
          python3 -B host_candidate/p265_operand_shape/p265_operand_shape.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-shape-reasons.log 2>&1
          p265_rc=$?
          python3 -B host_candidate/p267_invoke_words/p267_invoke_words.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P268-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p268-invoke-words.log 2>&1
          p267_rc=$?
          set -e
          echo "P268_CLASSIFIER_EXIT=$classifier_rc"
          echo "P268_UNCHANGED_P245_VERIFIER_EXIT=$p245_rc"
          echo "P268_P251_IDENTITY_CLASSIFIER_EXIT=$p251_rc"
          echo "P268_P253_NORMAL_CFG_CLASSIFIER_EXIT=$p253_rc"
          echo "P268_P255_EXPLICIT_BRANCH_CLASSIFIER_EXIT=$p255_rc"
          echo "P268_P257_OPCODE_FAMILY_CLASSIFIER_EXIT=$p257_rc"
          echo "P268_P259_ALL_OPERANDS_CLASSIFIER_EXIT=$p259_rc"
          echo "P268_P261_ALL_METHODS_CLASSIFIER_EXIT=$p261_rc"
          echo "P268_P263_DIVERGENCE_CLASSIFIER_EXIT=$p263_rc"
          echo "P268_P265_SHAPE_CLASSIFIER_EXIT=$p265_rc"
          echo "P268_P267_INVOKE_WORD_CLASSIFIER_EXIT=$p267_rc"
          grep -E '^P267_(INVOKE_WORD_SEQUENCE_MATCH_CANDIDATE|INVOKE_WORD_SEQUENCE_CHANGED|INVOKE_WORD_COUNT_CHANGED|INVOKE_METHOD_REFERENCE_CHANGED|INVOKE_REFERENCE_NOT_ATTESTED|INVOKE_DESCRIPTOR_NOT_ATTESTED|INVOKE_WIDE_WORD_LAYOUT_INVALID|INVOKE_REGISTER_FRAME_INVALID|INVOKE_DECODER_OPERANDS_UNATTESTED|INVOKE_RAW_FORMAT_UNATTESTED|OTHER_ENCODING_FAMILY_NOT_ATTESTED|MULTIPLE_INSTRUCTION_DIFFERENCES_NOT_ATTESTED)=[0-9]{1,7}
          grep -E '^P265_SHAPE_(NORMALIZED_ITEM_COUNT|NORMALIZED_ITEM_KIND|RAW_ITEM_COUNT|RAW_TAG_ORDER|RAW_ITEM_ARITY|RAW_LAYOUT_SAME_UNATTESTED|ONE_SIDE_UNDECODABLE|BOTH_SIDES_UNDECODABLE|NORMALIZED_VALUES_CHANGED|OTHER_NOT_ATTESTED)=[0-9]{1,7}$' .p245tmp/p268-shape-reasons.log || true
          grep -E '^P265_(SHAPE_METHODS|DIVERGENT_METHODS|UNKNOWN_METHODS)=[0-9]{1,7}$' .p245tmp/p268-shape-reasons.log || true
          grep -E '^P265_IDENTITIES_AND_OPERAND_VALUES=WITHHELD$' .p245tmp/p268-shape-reasons.log || true
          grep -E '^P265_(ENCODING_REPRESENTATION_EQUIVALENCE|ALL_UNKNOWN_METHODS|UNCHANGED_P245_GATE|ART_AND_PROCESS_OWNER)=NOT_ATTESTED$' .p245tmp/p268-shape-reasons.log || true
          grep -E '^P265_RELEASE=DENY$' .p245tmp/p268-shape-reasons.log || true
          grep -E '^P265_DENY_[A-Z0-9_]+$' .p245tmp/p268-shape-reasons.log || true
          grep -E '^P246_DENY_[A-Z0-9_]+$' .p245tmp/p268-shape-reasons.log || true
          grep -E '^P263_(DIVERGENT_SIZE_CHANGED|DIVERGENT_SIZE_STABLE|DIVERGENT_OPCODE_UNCHANGED|DIVERGENT_OPCODE_ENCODING|DIVERGENT_OPCODE_KIND|DIVERGENT_REGISTER|DIVERGENT_LITERAL|DIVERGENT_RESOLVED_REFERENCE|DIVERGENT_OPERAND_SHAPE|DIVERGENT_MULTIPLE_TYPES|UNKNOWN_PAYLOAD|UNKNOWN_INSTRUCTION_COUNT|UNKNOWN_OPERAND_FORMAT|UNKNOWN_OTHER)=[0-9]{1,7}$' .p245tmp/p268-divergence-correlation.log || true
          grep -E '^P263_SCOPE=ALL_ORIGINAL_PRIMARY_METHODS$' .p245tmp/p268-divergence-correlation.log || true
          grep -E '^P263_IDENTITY_AND_OPERANDS=WITHHELD$' .p245tmp/p268-divergence-correlation.log || true
          grep -E '^P263_(COMPLETE_SEMANTIC_PARITY|UNCHANGED_P245_GATE|ART_PROCESS_OWNER)=NOT_ATTESTED$' .p245tmp/p268-divergence-correlation.log || true
          grep -E '^P263_RELEASE=DENY$' .p245tmp/p268-divergence-correlation.log || true
          grep -E '^P263_V139=STRUCTURAL_BLOCKED$' .p245tmp/p268-divergence-correlation.log || true
          grep -E '^P263_DENY_[A-Z0-9_]+$' .p245tmp/p268-divergence-correlation.log || true
          grep -E '^P246_DENY_[A-Z0-9_]+$' .p245tmp/p268-divergence-correlation.log || true
          grep -E '^P261_(ORIGINAL_CODE_METHODS|CODE_SIZE_CHANGED|RAW_EXCEPTION_CHANGED|EXCEPTION_ORDINAL_CHANGED|OPCODE_COUNT_CHANGED|OPCODE_ENCODING_CANDIDATE_ONLY|OPCODE_OPERATION_KIND_CHANGED|UNSUPPORTED_PAYLOAD_METHODS|BRANCH_SIGNATURE_CHANGED|FRAME_CHANGED|FRAME_NOT_ATTESTED|OPERANDS_STRUCTURED_MATCH|OPERANDS_STRUCTURED_DIFFER|OPERANDS_NOT_ATTESTED)=[0-9]{1,7}$' .p245tmp/p268-all-methods.log || true
          grep -E '^P261_SCOPE=ALL_ORIGINAL_CODE_METHODS$' .p245tmp/p268-all-methods.log || true
          grep -E '^P261_UNKNOWN_SWITCH_AND_PAYLOAD=COUNTED_NOT_IGNORED$' .p245tmp/p268-all-methods.log || true
          grep -E '^P261_(SUPPORTED_OPERANDS|COMPLETE_ART_SEMANTICS|ORIGINAL_P245_FULL_GATE|NODE_CHILD_ISOLATION_AND_P192_EGRESS)=(STRUCTURAL_ONLY|NOT_ATTESTED)$' .p245tmp/p268-all-methods.log || true
          grep -E '^P261_RELEASE=DENY$' .p245tmp/p268-all-methods.log || true
          grep -E '^P261_V139=STRUCTURAL_BLOCKED$' .p245tmp/p268-all-methods.log || true
          grep -E '^P261_DENY_[A-Z0-9_]+$' .p245tmp/p268-all-methods.log || true
          grep -E '^P246_DENY_[A-Z0-9_]+$' .p245tmp/p268-all-methods.log || true
          grep -E '^P259_FIRST_SIZE_GROUP=(NONE|START_COROUTINE|OTHER_PRIMARY)$' .p245tmp/p268-all-operands.log || true
          grep -E '^P259_FIRST_SIZE_LAYOUT=(NONE|SAME_LAYOUT|WIDTH_ONLY|OPCODE_CHANGED|COUNT_CHANGED)$' .p245tmp/p268-all-operands.log || true
          grep -E '^P259_ALL_OPCODE_FAMILIES=(NONE|COUNT_CHANGED|ONLY_ENCODING_CANDIDATES|HAS_OPERATION_KIND_CHANGE)$' .p245tmp/p268-all-operands.log || true
          grep -E '^P259_(ALL_INSTRUCTION_OPERANDS|UNCHANGED_OPCODE_OPERANDS|CHANGED_OPCODE_OPERANDS)=(NOT_APPLICABLE|STRUCTURED_MATCH|STRUCTURED_DIFFER|NOT_ATTESTED|COUNT_CHANGED)$' .p245tmp/p268-all-operands.log || true
          grep -E '^P259_REGISTER_FRAME=(MATCH|DIFFER|NOT_ATTESTED)$' .p245tmp/p268-all-operands.log || true
          grep -E '^P259_EXPLICIT_IF_GOTO_ORDINALS=(NONE|ORDINALS_MATCH_ONLY|ORDINALS_DIFFER)$' .p245tmp/p268-all-operands.log || true
