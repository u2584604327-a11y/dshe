name: P310 original-v138 P294 candidate Android35 ART package verify (release DENY)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p310_art_verify/**'
      - '.github/workflows/p310-original-art-verify-one-shot.yml'
permissions:
  contents: read
concurrency:
  group: p310-art-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-candidate-art:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P181_THREE_ORIGINAL_START_DENY: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
      P208_CI_METHOD_ENTRY_ONLY: '1'
      P209_FINAL_DENY_ONLY: '1'
      P74_FIXTURE_ENGINE_BRIDGE: '0'
      P75_RENDEZVOUS_FIXTURE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit source pins and temporary signer scope
        shell: bash
        run: |
          set -euo pipefail
          test "$P47_NO_HOST_FALLBACK" = 1
          test "$P181_THREE_ORIGINAL_START_DENY" = 1
          test "$P49_NODE_STAGE" = 0
          test "$P51_SIDE_BY_SIDE" = 0
          bash -n host_candidate/p310_art_verify/prepare_candidate.sh
          bash -n host_candidate/p310_art_verify/run_android35.sh
          test -f .github/workflows/p310-original-art-verify-one-shot.yml
          echo P310_SOURCE_SYNTAX_AND_SCOPE=PASS
      - name: Provision pinned disposable build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python3 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('androguard')=='4.1.4'
          PY
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Build SHA-locked original-derived P294 candidate with throwaway signer only
        shell: bash
        run: bash host_candidate/p310_art_verify/prepare_candidate.sh
      - name: Enable ephemeral Android35 KVM
        shell: bash
        run: if test -c /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Fresh Android35 package ART verify only, never launch original app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash host_candidate/p310_art_verify/run_android35.sh
      - name: Delete key APK DEX and source scratch; forbid release
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p208tmp .p209tmp .p245tmp .p279tmp .p291tmp .p310tmp
          echo P310_EPHEMERAL_SIGNER_APK_AND_TEST_LOGS_DESTROYED=YES >> "$GITHUB_STEP_SUMMARY"
          echo P310_OWNER_DEVICE_OR_PRODUCTION_SIGNER=NOT_USED >> "$GITHUB_STEP_SUMMARY"
          echo P310_ORIGINAL_NODE_EXECUTION=NOT_AUTHORIZED >> "$GITHUB_STEP_SUMMARY"
          echo P310_ORIGINAL_P245_P192_B3_B4=DENY >> "$GITHUB_STEP_SUMMARY"
          echo P310_ART_CLASS_LOAD_AND_ARM64=NOT_ATTESTED >> "$GITHUB_STEP_SUMMARY"
          echo P310_FORMAL_V139=STRUCTURAL_BLOCKED >> "$GITHUB_STEP_SUMMARY"
