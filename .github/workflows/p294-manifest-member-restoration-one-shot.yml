          python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py --patch
          python3 -B host_candidate/p279_counterfactual/p279_counterfactual.py --apply
          apktool b .p43tmp/decoded -o .p245tmp/P294-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p294-assembly.log 2>&1
          echo P294_ALTERNATE_TEMP_HELPER_LITERAL_REUSE_ASSEMBLY=PASS
          python3 -B host_candidate/p279_counterfactual/p279_counterfactual.py --restore
          python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py --restore
          echo P294_P279_THEN_ORIGINAL_P245_SOURCE_RESTORED=BYTE_EXACT
          trap - EXIT
          python3 - <<'PY'
          import zipfile
          b='.p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk'
          c='.p245tmp/P294-UNSIGNED-DO-NOT-INSTALL.apk'
          with zipfile.ZipFile(b) as base,zipfile.ZipFile(c,'a') as candidate:
            assert 'classes3.dex' not in candidate.namelist()
            candidate.writestr('classes3.dex',base.read('classes3.dex'),compress_type=zipfile.ZIP_STORED)
          print('P294_P245_VERBATIM_THIRD_DEX=PASS')
          PY
          # Apktool reassembly contains plaintext Manifest; P43's compiled
          # baseline uses validated binary AXML. Restore ONLY that member.
          python3 -B host_candidate/p293_manifest_parity/p293_manifest_parity.py --stage > .p245tmp/p294-manifest-stage.log 2>&1
          grep -Fxq 'P293_BASE_MANIFEST=BINARY_AXML' .p245tmp/p294-manifest-stage.log
          grep -Fxq 'P293_PRE_REPACK_CANDIDATE_MANIFEST=PLAINTEXT_XML' .p245tmp/p294-manifest-stage.log
          grep -Fxq 'P293_STAGE_FROM_VALIDATED_BASE=BYTE_EXACT' .p245tmp/p294-manifest-stage.log
          (cd .p245tmp && zip -q -d P294-UNSIGNED-DO-NOT-INSTALL.apk AndroidManifest.xml)
          (cd .p245tmp/p293-staged-manifest && zip -q -0 ../P294-UNSIGNED-DO-NOT-INSTALL.apk AndroidManifest.xml)
          python3 -B host_candidate/p293_manifest_parity/p293_manifest_parity.py --verify > .p245tmp/p294-manifest-verify.log 2>&1
          grep -Fxq 'P293_FINAL_MANIFEST=BINARY_AXML' .p245tmp/p294-manifest-verify.log
          grep -Fxq 'P293_FINAL_MANIFEST_MEMBER=BYTE_EXACT_BASELINE' .p245tmp/p294-manifest-verify.log
          echo P294_PINNED_BINARY_MANIFEST_RESTORED_EXACTLY=PASS
          test "$(git hash-object host_candidate/p245_build_only_probe/p245_build_only_probe.py)" = 06f62f4d8c8ee141b6b2030ee6556c9a43d9e499
          python3 -B host_candidate/p291_candidate_gate/p291_candidate_gate.py --create-copy > .p245tmp/p294-p291-source-create.log 2>&1
          grep -Fxq 'P291_ORIGINAL_P245_SOURCE=BYTE_EXACT_UNMODIFIED' .p245tmp/p294-p291-source-create.log
          grep -Fxq 'P291_TEMP_ONLY_SINGLE_TEXT_PREDICATE_REPLACED=PASS' .p245tmp/p294-p291-source-create.log
          test -s .p291tmp/P291-TEMP-P245-VERIFIER-DO-NOT-RELEASE.py
          echo P294_CANDIDATE_ONLY_TEMP_COPY_CREATED=PASS
          # Both real checks MUST run. Always sanitize logs: only fixed deny
          # categories may be sent to public CI, never app method names.
          set +e
          python3 -B host_candidate/p249_dual_diff/p249_dual_diff.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P294-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p294-first-diff.log 2>&1
          classifier_rc=$?
          python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py \
            --verify .p245tmp/P294-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p294-original-gate.log 2>&1
          p245_rc=$?
          python3 -B .p291tmp/P291-TEMP-P245-VERIFIER-DO-NOT-RELEASE.py \
            --verify .p245tmp/P294-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p294-strict-candidate-gate.log 2>&1
          p291_rc=$?
          python3 -B host_candidate/p251_method_relation/p251_method_relation.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P294-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p294-method-identity.log 2>&1
          p251_rc=$?
          python3 -B host_candidate/p253_cfg_ordinal/p253_cfg_ordinal.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P294-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p294-cfg-first-size.log 2>&1
          p253_rc=$?
          python3 -B host_candidate/p255_branch_separation/p255_branch_separation.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P294-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p294-branch-signature.log 2>&1
          p255_rc=$?
          python3 -B host_candidate/p257_opcode_family/p257_opcode_family.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
