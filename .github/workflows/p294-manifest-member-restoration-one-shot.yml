          grep -Eq '^Ran 26 tests in' "$RUNNER_TEMP/p294-p249-unit.log"
          grep -Fxq OK "$RUNNER_TEMP/p294-p249-unit.log"
          test "$(git hash-object host_candidate/p251_method_relation/p251_method_relation.py)" = 136289c3d270d130270ce0b648070996df73b14a
          python3 -B host_candidate/p251_method_relation/test_p251_method_relation.py > "$RUNNER_TEMP/p294-p251-fixture.log" 2>&1
