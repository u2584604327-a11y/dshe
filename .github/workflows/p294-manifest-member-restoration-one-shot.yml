# P294: isolated, non-release dual-verifier evidence only; original P245 immutable.
name: P294 one-shot strict binary Manifest byte-for-byte repair plus P245 candidate, original DENY
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/p294-manifest-member-restoration-one-shot.yml'
permissions:
  contents: read
concurrency:
  group: p294-one-shot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p294-operand-shape:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P181_THREE_ORIGINAL_START_DENY: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
      P208_CI_METHOD_ENTRY_ONLY: '1'
      P209_FINAL_DENY_ONLY: '1'
      P74_FIXTURE_ENGINE_BRIDGE: '0'
      P75_RENDEZVOUS_FIXTURE: '0'
