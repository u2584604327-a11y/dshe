# P298: source-only deny-only indexed field/type/string pool tests.
name: P298 source-only raw DEX string/type/field pool references audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p298_other_pool_refs/**'
      - '.github/workflows/p298-other-pool-refs-source.yml'
permissions:
  contents: read
concurrency:
  group: p298-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p298-source:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source-only P298 46 cases and pinned P245/P297
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('p298_other_pool_refs.py','test_p298_other_pool_refs.py'):
            p=Path('host_candidate/p298_other_pool_refs')/name
            compile(p.read_text(encoding='utf-8'),str(p),'exec')
          print('P298_SOURCE_SYNTAX=PASS')
          PY
          test "$(git hash-object host_candidate/p245_build_only_probe/p245_build_only_probe.py)" = 06f62f4d8c8ee141b6b2030ee6556c9a43d9e499
          test "$(git hash-object host_candidate/p297_raw_invoke_pool/p297_raw_invoke_pool.py)" = 71beaf48cc4eb53de00a33489f16b8f7c94cecf8
          test "$(git hash-object host_candidate/p298_other_pool_refs/p298_other_pool_refs.py)" = ebee9de3ca891184b1599929b8b6a64ed2cea0b9
          python3 -B host_candidate/p298_other_pool_refs/test_p298_other_pool_refs.py 2>&1 | tee "$RUNNER_TEMP/p298-tests.log"
          grep -Eq '^Ran 46 tests in' "$RUNNER_TEMP/p298-tests.log"
          grep -Fxq OK "$RUNNER_TEMP/p298-tests.log"
          python3 -B host_candidate/p298_other_pool_refs/p298_other_pool_refs.py | tee "$RUNNER_TEMP/p298-source.log"
          grep -Fxq P298_REAL_OTHER_POOL_REFS=NOT_ATTESTED "$RUNNER_TEMP/p298-source.log"
          grep -Fxq P298_RELEASE=DENY "$RUNNER_TEMP/p298-source.log"
          echo P298_ACTUAL_46_OF_46=PASS
          echo P298_ORIGINAL_P245_BLOB=BYTE_EXACT
          echo P298_RELEASE=DENY
          echo P298_V139=STRUCTURAL_BLOCKED
