name: P250 one-shot uninstalled original exception first-difference audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/p250-dual-difference-one-shot.yml'
permissions:
  contents: read
concurrency:
  group: p250-one-shot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p250-exception-first-diff:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P181_THREE_ORIGINAL_START_DENY: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
      P208_CI_METHOD_ENTRY_ONLY: '1'
      P209_FINAL_DENY_ONLY: '1'
      P74_FIXTURE_ENGINE_BRIDGE: '0'
      P75_RENDEZVOUS_FIXTURE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python source syntax and 15 fail-closed tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for n in ('p245_build_only_probe.py','test_p245_build_only_probe.py'):
            p=Path('host_candidate/p245_build_only_probe')/n
            compile(p.read_text(),str(p),'exec')
          print('P245_SOURCE_SYNTAX=PASS')
          PY
          python3 -B host_candidate/p245_build_only_probe/test_p245_build_only_probe.py 2>&1 | tee "$RUNNER_TEMP/p245-unit.log"
          grep -Eq '^Ran 15 tests in' "$RUNNER_TEMP/p245-unit.log"
          grep -Fxq OK "$RUNNER_TEMP/p245-unit.log"
          python3 -B host_candidate/p246_exception_semantics/test_p246_exception_semantics.py > "$RUNNER_TEMP/p250-p246-test.log" 2>&1
          grep -Eq '^Ran 30 tests in' "$RUNNER_TEMP/p250-p246-test.log"
          grep -Fxq OK "$RUNNER_TEMP/p250-p246-test.log"
          python3 -B host_candidate/p246_exception_semantics/test_p247_classifier_contract.py > "$RUNNER_TEMP/p250-p247-test.log" 2>&1
          grep -Eq '^Ran 12 tests in' "$RUNNER_TEMP/p250-p247-test.log"
          grep -Fxq OK "$RUNNER_TEMP/p250-p247-test.log"
          python3 -B host_candidate/p249_dual_diff/test_p249_dual_diff.py > "$RUNNER_TEMP/p250-p249-unit.log" 2>&1
          grep -Eq '^Ran 26 tests in' "$RUNNER_TEMP/p250-p249-unit.log"
          grep -Fxq OK "$RUNNER_TEMP/p250-p249-unit.log"
          echo P250_SYNTHETIC_P245_15_P246_30_P247_12_P249_26=PASS
          test "$(git hash-object host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java)" = 44cd38245dc87b9eff960b15dc520e60a2754c2c
          test "$(git hash-object host_candidate/p43_original_service/build_embedded_emulator_apk.sh)" = 62ad8b62d5c0bfadf7d3b98294fd8713fb8f686f
      - name: Prepare existing P208 P209 temporary builder
        run: |
          set -euo pipefail
          python3 host_candidate/p208_original_start_coroutine/patch_ci_only.py --prepare-builder
          python3 host_candidate/p209_original_p47_deny/patch_gate_ci_only.py --prepare
          test -s .p209tmp/P47LaunchGate.java
      - name: Prepare pinned Android35 build tools
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python3 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('androguard')=='4.1.4'
          PY
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
      - name: Build original-pinned disposable baseline without install
        run: |
          set -euo pipefail
          mkdir -p .p208tmp .p245tmp
          bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh > .p208tmp/p245-build.log 2>&1 || { tail -n 20 .p208tmp/p245-build.log; exit 2; }
          grep -Fxq 'P209_PC176_POST_THROWONFAILURE_ONLY_REVERSIBLE_MARKER=PASS' .p208tmp/p245-build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p208tmp/p245-build.log
          grep -Fxq 'P181_ORIGINAL_V138_THREE_ENGINE_SPAWN_SITES_NO_HOST_EXEC=PASS' .p208tmp/p245-build.log
          python3 host_candidate/p209_original_p47_deny/verify_original_precall.py \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk > .p245tmp/p209.log
          grep -Fxq 'P209_ALL_ORIGINAL_BRANCH_TARGETS_RELOCATED_EXACTLY=PASS' .p245tmp/p209.log
          python3 -B host_candidate/p209_original_p47_deny/p244_signed_postreturn_slot_feasibility.py \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk > .p245tmp/p244.log
          grep -Fxq 'P244_35C_TO_3RC_SAME_WIDTH_ENCODING_CANDIDATE=YES' .p245tmp/p244.log
      - name: One-shot P245 replay and dual independent DENY verification
        run: |
          set -euo pipefail
          # Never run ADB, install, start Android/Node, or persist an APK artifact.
          trap 'python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py --restore >/dev/null 2>&1 || true' EXIT
          python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py --patch
          apktool b .p43tmp/decoded -o .p245tmp/P250-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p250-assembly.log 2>&1
          echo P250_IDENTICAL_P245_EPHEMERAL_SMALI_ASSEMBLY=PASS
          python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py --restore
          trap - EXIT
          python3 - <<'PY'
          import zipfile
          b='.p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk'
          c='.p245tmp/P250-UNSIGNED-DO-NOT-INSTALL.apk'
          with zipfile.ZipFile(b) as base,zipfile.ZipFile(c,'a') as candidate:
            assert 'classes3.dex' not in candidate.namelist()
            candidate.writestr('classes3.dex',base.read('classes3.dex'),compress_type=zipfile.ZIP_STORED)
          print('P250_P245_VERBATIM_THIRD_DEX=PASS')
          PY
          # Both real checks MUST run. Always sanitize logs: only fixed deny
          # categories may be sent to public CI, never app method names.
          set +e
          python3 -B host_candidate/p249_dual_diff/p249_dual_diff.py \
            --signed-original .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --base .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk \
            --candidate .p245tmp/P250-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p250-first-diff.log 2>&1
          classifier_rc=$?
          python3 -B host_candidate/p245_build_only_probe/p245_build_only_probe.py \
            --verify .p245tmp/P250-UNSIGNED-DO-NOT-INSTALL.apk > .p245tmp/p250-original-gate.log 2>&1
          p245_rc=$?
          set -e
          echo "P250_CLASSIFIER_EXIT=$classifier_rc"
          echo "P250_UNCHANGED_P245_VERIFIER_EXIT=$p245_rc"
          grep -E '^P249_FIRST_CODE_SIZE_GROUP=(NONE|START_COROUTINE|OTHER_PRIMARY)$' .p245tmp/p250-first-diff.log || true
          grep -E '^P249_FIRST_EXCEPTION_GROUP=(NONE|START_COROUTINE|OTHER_PRIMARY)$' .p245tmp/p250-first-diff.log || true
          grep -E '^P249_FIRST_CODE_SIZE_CATEGORY=(NONE|CODE_SIZE)$' .p245tmp/p250-first-diff.log || true
          grep -E '^P249_FIRST_EXCEPTION_CATEGORY=(NONE|TRY_COUNT|TRY_ORDER|TRY_SPAN|TYPED_COUNT|HANDLER_ORDER|TYPE_DESCRIPTOR|TYPED_TARGET|CATCHALL_PRESENCE|CATCHALL_TARGET|UNCLASSIFIED_DENY)$' .p245tmp/p250-first-diff.log || true
          grep -E '^P249_(CODE_SIZE_GATE|EXCEPTION_GATE)=(DENY|PARITY)$' .p245tmp/p250-first-diff.log || true
          grep -E '^P246_DENY_[A-Z0-9_]+$' .p245tmp/p250-first-diff.log || true
          grep -E '^P249_DENY_[A-Z0-9_]+$' .p245tmp/p250-first-diff.log || true
          grep -E '^P245_BUILD_ONLY_DENY_CODE=[A-Z0-9_]+$' .p245tmp/p250-original-gate.log || true
          if test "$classifier_rc" -eq 0 && test "$p245_rc" -eq 0; then
            grep -Fxq 'P249_CODE_SIZE_GATE=PARITY' .p245tmp/p250-first-diff.log
            grep -Fxq 'P249_EXCEPTION_GATE=PARITY' .p245tmp/p250-first-diff.log
            grep -Fxq 'P245_STATIC_BUILD_ONLY=PASS' .p245tmp/p250-original-gate.log
            echo P250_FULL_STATIC_PARITY=PASS
          else
            echo P250_FULL_STATIC_PARITY=DENY
            echo P250_KEEP_PREVIOUS_P245_FAILURE_HARD_STOP=YES
            exit 2
          fi
          echo P250_ART_VERIFIER_AND_PROCESS_STATE=NOT_ATTESTED
          echo P250_V139=STRUCTURAL_BLOCKED
      - name: Destroy all temporary files with no persisted APK
        if: always()
        run: |
          rm -rf .p43tmp .p208tmp .p209tmp .p245tmp
          echo P250_NO_ADB_NODE_EMULATOR_OR_USER_PHONE=YES
          echo P250_NO_APK_ZIP_ARTIFACT_PUBLICATION=YES
          echo P250_V139_STRUCTURAL_BLOCKED=YES
