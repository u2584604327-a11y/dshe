name: OGNET02 paired forwarded-Sidecar and public Relay diagnostic (offline tests)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p96_stream_owner/omnigate_relay_pair_probe.mjs'
      - 'host_candidate/p96_stream_owner/omnigate_relay_pair_probe.test.mjs'
      - 'host_candidate/OGNET02_RELAY_PAIR_RUNBOOK.md'
      - '.github/workflows/og-net02-paired-relay-readonly.yml'
permissions:
  contents: read
jobs:
  og-net02-safe-pair-fixtures:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030' &&
      github.event.pull_request.base.ref == 'dsh/p95-stream-to-message-tool-boundary-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline categorization; no ADB, no relay network, no user credentials
        shell: bash
        run: |
          set -euo pipefail
          node --check host_candidate/p96_stream_owner/omnigate_relay_pair_probe.mjs
          node --test host_candidate/p96_stream_owner/omnigate_relay_pair_probe.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('host_candidate/p96_stream_owner/omnigate_relay_pair_probe.mjs').read_text()
          assert "method:'GET'" in s
          assert "issued_post:false" in s and "credentials_sent:false" in s
          assert 'remote_registration_verified:false' in s
          assert 'model_reply_verified:false' in s
          assert 'RELAY_DEVICE_OFFLINE' in s
          assert 'adb_forward_127.0.0.1_18787' in s
          assert 'gw-33e850180248' not in s
          print('OGNET02_RELAY_503_PAIR_CLASSIFIER=PASS_OFFLINE')
          print('OGNET02_NO_API_KEYS_NO_POST_NO_AUTO_RESTART=PASS')
          print('OGNET02_ACTUAL_ADB_DEVICE_AND_PUBLIC_RELAY=NOT_TESTED')
          PY
          echo 'OGNET02_PAIR_CLASSIFICATION=PASS_OFFLINE_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'OGNET02_DEVICE_OR_RELAY_FIXED=NOT_PROVEN' >> "$GITHUB_STEP_SUMMARY"
