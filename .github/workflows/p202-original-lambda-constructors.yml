name: P202 signed v138 original Kotlin suspend lambda constructor owners (no Node)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p202_original_lambda_constructors/**'
      - '.github/workflows/p202-original-lambda-constructors.yml'
permissions:
  contents: read
concurrency:
  group: p202-original-lambda-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-original-lambda-instantiation:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P181_THREE_ORIGINAL_START_DENY: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Nineteen synthetic negatives, exact source provenance and deny checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -B host_candidate/p202_original_lambda_constructors/test_original_lambda_constructors.py 2>&1 | tee "$RUNNER_TEMP/p202-tests.log"
          grep -Eq '^Ran 19 tests in' "$RUNNER_TEMP/p202-tests.log"
          grep -Fxq OK "$RUNNER_TEMP/p202-tests.log"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("host_candidate/p202_original_lambda_constructors/audit_original_lambda_constructors.py")
          compile(p.read_text(),str(p),"exec")
          assert "NOT_PROVEN" in p.read_text()
          assert "NOT_ATTESTED" in p.read_text()
          print("P202_SOURCE_STATIC_ONLY_NO_RUNTIME_AUTHORITY=PASS")
          PY
          test "$(git hash-object host_candidate/p201_original_start_owners/audit_original_start_owners.py)" = 24981c7a92bcf242e3b21136dead5d0ecfaa3e6e
          test "$(git hash-object host_candidate/p198_original_source/audit_entry_callers.py)" = 089dd16afb6ff7bf7c9092ee0e41346b77823570
          test "$(git hash-object host_candidate/p43_original_service/build_embedded_emulator_apk.sh)" = 62ad8b62d5c0bfadf7d3b98294fd8713fb8f686f
          test "$P47_NO_HOST_FALLBACK" = 1
          test "$P181_THREE_ORIGINAL_START_DENY" = 1
          test "$P49_NODE_STAGE" = 0
          test "$P51_SIDE_BY_SIDE" = 0
          test -s THIRD_PARTY_LICENSES/DSHAPP-MIT.txt
          test -s REFERENCE_PROJECTS_AND_VM_DISCLAIMER.md
          test -s host_candidate/p201_original_start_owners/README.md
          echo P202_SOURCE_PINS_AND_REAL_PHONE_SAFETY_PLAN=PASS
      - name: Build temporary P47-denied v138 APK to obtain exact original signed baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python3 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("androguard")=="4.1.4"
          print("P202_PINNED_ANDROGUARD=PASS")
          PY
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -s "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/d8"
          mkdir -p .p202tmp
          if ! bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh > .p202tmp/build.log 2>&1; then
            echo P202_P43_ORIGINAL_DERIVED_DENY_ONLY_BUILD_FAILED
            exit 2
          fi
          test -s .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk
          grep -Fxq 'P43_ORIGINAL_ASSETS_LIBRARIES_AND_SECONDARY_DEX=PASS_SHA' .p202tmp/build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p202tmp/build.log
          grep -Fxq 'P181_ORIGINAL_V138_THREE_ENGINE_SPAWN_SITES_NO_HOST_EXEC=PASS' .p202tmp/build.log
          grep -Fxq 'P182_ORIGINAL_V138_TYPED_DENY_BRIDGES_VERIFIED_IN_REBUILT_DEX=PASS' .p202tmp/build.log
          echo P202_REAL_ORIGINAL_SIGNED_V138_APK_READY=PASS
      - name: Verify four exact original coroutine lambda constructor sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -B host_candidate/p202_original_lambda_constructors/audit_original_lambda_constructors.py \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            --report .p202tmp/redacted.json | tee "$RUNNER_TEMP/p202-proof.log"
          grep -Fxq 'P202_ACTUAL_ORIGINAL_V138_FOUR_LAMBDAS_AND_CALLCHAIN=PASS' "$RUNNER_TEMP/p202-proof.log"
          for tag in AUTO_SAFE BOOT MANUAL_SAFE OBSERVE; do
            grep -Eq "^P202_${tag}_CONSTRUCTOR_CALLSITES=[0-9]+$" "$RUNNER_TEMP/p202-proof.log"
            grep -Eq "^P202_${tag}_NEW_INSTANCE_SITES=[0-9]+$" "$RUNNER_TEMP/p202-proof.log"
          done
          grep -Fxq 'P202_REAL_UI_EVENT_DISPATCH=NOT_PROVEN' "$RUNNER_TEMP/p202-proof.log"
          grep -Fxq 'P202_REAL_ORIGINAL_KOTLIN_COROUTINE=NOT_EXECUTED' "$RUNNER_TEMP/p202-proof.log"
          grep -Fxq 'P202_OS_OWNER_EPOCH_AND_P184_REAL_COROUTINE=NOT_ATTESTED' "$RUNNER_TEMP/p202-proof.log"
          grep -Fxq 'P202_ORIGINAL_NODE_HTTP_READY=NOT_WIRED' "$RUNNER_TEMP/p202-proof.log"
          grep -Fxq 'P202_V139=STRUCTURAL_BLOCKED' "$RUNNER_TEMP/p202-proof.log"
          python3 - <<'PY'
          import json
          q=json.load(open(".p202tmp/redacted.json"))
          assert q["original_sha256"]=="3ca56655d79afc57431636e340823e7071bc830615ca615c485b0b9a30b6e3e5"
          assert q["original_start_callsites_verified"] is True
          assert set(q["lambda_origins"])=={"AUTO_SAFE","BOOT","MANUAL_SAFE","OBSERVE"}
          assert q["real_android_button_tapped"] is False
          assert q["actual_original_coroutine_executed"] is False
          assert q["p184_receipt_delivered_to_real_coroutine"] is False
          assert q["arm64_node_fd_http_ready"] is False
          assert q["release"]=="STRUCTURAL_BLOCKED"
          print("P202_CONSTRUCTOR_OWNER_SYMBOLS_NOT_UI_EXECUTION=PASS")
          PY
      - name: Remove temporary APKs and reports; retain all production gates
        if: always()
        shell: bash
        run: |
          rm -rf .p43tmp .p202tmp
          echo P202_ACTUAL_ORIGINAL_CONSTRUCTOR_OWNER=CHECK_REAL_BINARY_JOB >> "$GITHUB_STEP_SUMMARY"
          echo P202_ACTUAL_ORIGINAL_KOTLIN_COROUTINE=NOT_EXECUTED >> "$GITHUB_STEP_SUMMARY"
          echo P202_REAL_PHONE_USER_PERMISSION=FUTURE_ONLY >> "$GITHUB_STEP_SUMMARY"
          echo P202_DIFFERENT_SIGNER_INPLACE_UPGRADE=FORBIDDEN >> "$GITHUB_STEP_SUMMARY"
          echo P202_P47_HOST_PROCESSBUILDER_FALLBACK=DENY >> "$GITHUB_STEP_SUMMARY"
          echo P202_NATIVE_SENSITIVE_TOOLS=DENY_ALL >> "$GITHUB_STEP_SUMMARY"
          echo P202_GS_SCREENSHOT=OFF >> "$GITHUB_STEP_SUMMARY"
          echo P202_ORIGINAL_ARM64_NODE_FD_HTTP=NOT_WIRED >> "$GITHUB_STEP_SUMMARY"
          echo P202_V139=STRUCTURAL_BLOCKED >> "$GITHUB_STEP_SUMMARY"
