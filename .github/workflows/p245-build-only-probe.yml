name: P245 uninstalled equal-width process probe static-only
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: p245-${{ github.ref }}-${{ github.event.action }}-${{ github.event.label.name }}
  cancel-in-progress: true
jobs:
  p245-build-only:
    if: >-
      github.event.label.name == 'v139-check-dex' &&
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P47_NO_HOST_FALLBACK: '1'
      P181_THREE_ORIGINAL_START_DENY: '1'
      P49_NODE_STAGE: '0'
      P51_SIDE_BY_SIDE: '0'
      P208_CI_METHOD_ENTRY_ONLY: '1'
      P209_FINAL_DENY_ONLY: '1'
      P74_FIXTURE_ENGINE_BRIDGE: '0'
      P75_RENDEZVOUS_FIXTURE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python source syntax and 15 fail-closed tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for n in ('p245_build_only_probe.py','test_p245_build_only_probe.py'):
            p=Path('host_candidate/p245_build_only_probe')/n
            compile(p.read_text(),str(p),'exec')
          print('P245_SOURCE_SYNTAX=PASS')
          PY
          python3 -B host_candidate/p245_build_only_probe/test_p245_build_only_probe.py 2>&1 | tee "$RUNNER_TEMP/p245-unit.log"
          grep -Eq '^Ran 15 tests in' "$RUNNER_TEMP/p245-unit.log"
          grep -Fxq OK "$RUNNER_TEMP/p245-unit.log"
          test "$(git hash-object host_candidate/p47_no_fallback/android/com/dsh/android/p47/P47LaunchGate.java)" = 44cd38245dc87b9eff960b15dc520e60a2754c2c
          test "$(git hash-object host_candidate/p43_original_service/build_embedded_emulator_apk.sh)" = 62ad8b62d5c0bfadf7d3b98294fd8713fb8f686f
      - name: Prepare existing P208 P209 temporary builder
        run: |
          set -euo pipefail
          python3 host_candidate/p208_original_start_coroutine/patch_ci_only.py --prepare-builder
          python3 host_candidate/p209_original_p47_deny/patch_gate_ci_only.py --prepare
          test -s .p209tmp/P47LaunchGate.java
      - name: Prepare pinned Android35 build tools
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir -r host_candidate/requirements.txt
          python3 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('androguard')=='4.1.4'
          PY
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apktool
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
      - name: Build original-pinned disposable baseline without install
        run: |
          set -euo pipefail
          mkdir -p .p208tmp .p245tmp
          bash host_candidate/p43_original_service/build_embedded_emulator_apk.sh > .p208tmp/p245-build.log 2>&1 || { tail -n 20 .p208tmp/p245-build.log; exit 2; }
          grep -Fxq 'P209_PC176_POST_THROWONFAILURE_ONLY_REVERSIBLE_MARKER=PASS' .p208tmp/p245-build.log
          grep -Fxq 'P47_REBUILT_ORIGINAL_PRIMARY_ENGINE_BRIDGE_NO_HOST_START=PASS' .p208tmp/p245-build.log
          grep -Fxq 'P181_ORIGINAL_V138_THREE_ENGINE_SPAWN_SITES_NO_HOST_EXEC=PASS' .p208tmp/p245-build.log
          python3 host_candidate/p209_original_p47_deny/verify_original_precall.py \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk > .p245tmp/p209.log
          grep -Fxq 'P209_ALL_ORIGINAL_BRANCH_TARGETS_RELOCATED_EXACTLY=PASS' .p245tmp/p209.log
          python3 -B host_candidate/p209_original_p47_deny/p244_signed_postreturn_slot_feasibility.py \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk \
            .p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk > .p245tmp/p244.log
          grep -Fxq 'P244_35C_TO_3RC_SAME_WIDTH_ENCODING_CANDIDATE=YES' .p245tmp/p244.log
      - name: Reproduce historical DENY and verify the safe-literal DEX
        run: |
          set -euo pipefail
          gate=host_candidate/p245_build_only_probe/p245_build_only_probe.py
          literals=host_candidate/p279_counterfactual/p279_counterfactual.py
          signed=.p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk
          base=.p43tmp/P43-ORIGINAL-DSH-EPHEMERAL-EMULATOR-ONLY.apk
          trap 'python3 -B "$literals" --restore >/dev/null 2>&1 || true; python3 -B "$gate" --restore >/dev/null 2>&1 || true' EXIT
          python3 -B "$gate" --patch
          apktool b .p43tmp/decoded -o .p245tmp/with-new-literals.apk
          python3 -B "$literals" --apply
          apktool b .p43tmp/decoded -o .p245tmp/with-reused-literals.apk
          python3 -B "$literals" --restore
          python3 -B "$gate" --restore
          trap - EXIT
          for flavor in with-new-literals with-reused-literals; do
            python3 -B host_candidate/p245_build_only_probe/stage_candidate.py "$base" \
              ".p245tmp/$flavor.apk" ".p245tmp/$flavor-UNSIGNED-DO-NOT-INSTALL.apk"
          done
          expect_original_denial() {
            local result=0
            python3 -B "$gate" --verify "$1" > "$RUNNER_TEMP/p245-original.log" 2>&1 || result=$?
            cat "$RUNNER_TEMP/p245-original.log"
            test "$result" -eq 2
            grep -Fxq "P245_BUILD_ONLY_DENY_CODE=P209_NODE_BOOTSTRAP_DENY_$2" "$RUNNER_TEMP/p245-original.log"
          }
          expect_original_denial .p245tmp/with-new-literals-UNSIGNED-DO-NOT-INSTALL.apk ORIGINAL_EXCEPTION_SEMANTICS
          candidate=.p245tmp/with-reused-literals-UNSIGNED-DO-NOT-INSTALL.apk
          expect_original_denial "$candidate" HELPER_TYPED_READ_AND_CATCH
          python3 -B host_candidate/p245_build_only_probe/strict_dex.py \
            --signed-original "$signed" --base "$base" --candidate "$candidate"
          python3 -B host_candidate/p245_build_only_probe/test_strict_dex.py "$base" "$candidate"
      - name: Compare the current owner-bound TEST coroutine and deliberate DEX mutations
        shell: bash
        run: |
          set -euo pipefail
          bash host_candidate/engine_runtime/prepare_owned_dex.sh \
            .p43tmp/DSH-vc138-P0-OFFLINE-TEST-fixed-signature.apk .p245tmp --negative-checks
      - name: Destroy all temporary outputs, never install or upload
        if: always()
        run: |
          rm -rf .p43tmp .p208tmp .p209tmp .p245tmp .p279tmp
          echo P245_NO_EMULATOR_ADB_PHONE_OR_RELEASE=YES
          echo P245_V139_STRUCTURAL_BLOCKED=YES
