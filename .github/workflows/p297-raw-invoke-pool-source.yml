# P297: source-only deny-only raw invoke pool tests.
name: P297 source-only raw 35c/3rc invoke method pool audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'host_candidate/p297_raw_invoke_pool/**'
      - '.github/workflows/p297-raw-invoke-pool-source.yml'
permissions:
  contents: read
concurrency:
  group: p297-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p297-source:
    if: >-
      github.event.pull_request.number == 80 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dsh/p96-original-engine-stream-owner-narrow-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source-only P297 30 cases and unchanged P245
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('p297_raw_invoke_pool.py','test_p297_raw_invoke_pool.py'):
            p=Path('host_candidate/p297_raw_invoke_pool')/name
            compile(p.read_text(encoding='utf-8'),str(p),'exec')
          print('P297_SOURCE_SYNTAX=PASS')
          PY
          test "$(git hash-object host_candidate/p245_build_only_probe/p245_build_only_probe.py)" = 06f62f4d8c8ee141b6b2030ee6556c9a43d9e499
          python3 -B host_candidate/p297_raw_invoke_pool/test_p297_raw_invoke_pool.py 2>&1 | tee "$RUNNER_TEMP/p297-tests.log"
          grep -Eq '^Ran 30 tests in' "$RUNNER_TEMP/p297-tests.log"
          grep -Fxq OK "$RUNNER_TEMP/p297-tests.log"
          python3 -B host_candidate/p297_raw_invoke_pool/p297_raw_invoke_pool.py | tee "$RUNNER_TEMP/p297-source.log"
          grep -Fxq P297_REAL_RAW_INVOKE_POOL=NOT_ATTESTED "$RUNNER_TEMP/p297-source.log"
          grep -Fxq P297_RELEASE=DENY "$RUNNER_TEMP/p297-source.log"
          echo P297_ACTUAL_30_OF_30=PASS
          echo P297_ORIGINAL_P245_BLOB=BYTE_EXACT
          echo P297_RELEASE=DENY
          echo P297_V139=STRUCTURAL_BLOCKED
